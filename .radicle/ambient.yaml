pre_plan:
  - action: npm_get
plan:
  - action: shell
    shell: |
      cd /ci/src
      find /ci/deps/npm -name '*.tgz' -type f -exec npm cache add {} \;
      npm ci --offline
      node scripts/check-repo-hygiene.mjs
      MIGRATION_INTEGRITY_BASE=67ca9e5de534df2ae1b9d4e1301bcc7dfce6083b node scripts/check-migration-integrity.mjs
      bash ops/vps/radicle-ci/scripts/ambient-executor-patch.test.sh
      bash ops/vps/radicle-ci/scripts/repository-allowlist.test.sh
      bash ops/vps/radicle-ci/scripts/promotion-controller.test.sh
      bash ops/vps/radicle-ci/scripts/backup-proof-state.test.sh
      bash ops/vps/hns-state-backup/hns-state-backup.test.sh

name: core-tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit-tests:
    name: unit-tests (${{ matrix.shard }}/2)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install Core dependencies
        run: bun install --frozen-lockfile

      - name: Install API specification dependencies
        working-directory: specs/api
        run: bun install --frozen-lockfile

      - name: Run unit tests in isolated processes
        shell: bash
        env:
          TEST_SHARD: ${{ matrix.shard }}
          TEST_SHARD_COUNT: 2
        run: |
          set -uo pipefail
          mapfile -t test_files < <(
            find packages scripts services specs -type f \
              \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' \) \
              ! -path 'scripts/bookings/migration-integration.test.ts' \
              ! -path 'scripts/control-plane/operator-credentials-migration.test.ts' \
              -print | sort
          )

          failures=0
          selected=0
          for index in "${!test_files[@]}"; do
            if (( index % TEST_SHARD_COUNT != TEST_SHARD - 1 )); then
              continue
            fi
            test_file="${test_files[$index]}"
            selected=$((selected + 1))
            echo "::group::${test_file}"
            if ! bun test "${test_file}" --timeout=30000; then
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          done

          echo "Shard ${TEST_SHARD}/${TEST_SHARD_COUNT}: ${selected} files, ${failures} failed"
          if (( selected == 0 || failures > 0 )); then
            exit 1
          fi

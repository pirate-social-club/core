name: hns-integration

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hns-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      dns: ${{ steps.detect.outputs.dns }}
      backup: ${{ steps.detect.outputs.backup }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Detect HNS integration inputs
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "dns=true" >> "$GITHUB_OUTPUT"
            echo "backup=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
          else
            base_ref="${{ github.event.before }}"
          fi
          if [[ -z "$base_ref" || "$base_ref" == "0000000000000000000000000000000000000000" ]]; then
            base_ref="HEAD~1"
          fi

          changed="$(git diff --name-only "$base_ref"...HEAD)"
          if grep -Eq '^(.github/workflows/hns-integration.yml|services/verifier/hns/|ops/vps/hns-(authoritative-dns|secondary-dns|local-test)/)' <<< "$changed"; then
            echo "dns=true" >> "$GITHUB_OUTPUT"
          else
            echo "dns=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(.github/workflows/hns-integration.yml|ops/vps/hns-(authoritative-dns|state-backup|local-test)/)' <<< "$changed"; then
            echo "backup=true" >> "$GITHUB_OUTPUT"
          else
            echo "backup=false" >> "$GITHUB_OUTPUT"
          fi

  dns:
    needs: changes
    if: needs.changes.outputs.dns == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Run primary, secondary, DNSSEC, TSIG, and TLSA integration
        run: bash ops/vps/hns-local-test/run.sh

  backup:
    needs: changes
    if: needs.changes.outputs.backup == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Run encrypted Object Lock backup and restore integration
        run: bash ops/vps/hns-local-test/backup-roundtrip.sh

  gate:
    name: hns-integration-gate
    needs: [changes, dns, backup]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require selected HNS integrations
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DNS_RESULT: ${{ needs.dns.result }}
          BACKUP_RESULT: ${{ needs.backup.result }}
        run: |
          set -euo pipefail
          [[ "$CHANGES_RESULT" == "success" ]]
          [[ "$DNS_RESULT" == "success" || "$DNS_RESULT" == "skipped" ]]
          [[ "$BACKUP_RESULT" == "success" || "$BACKUP_RESULT" == "skipped" ]]

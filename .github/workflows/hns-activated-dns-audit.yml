name: hns-activated-dns-audit

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: hns-activated-dns-audit
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10

      - name: Audit activated public DNS
        id: dns_audit
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          bun run --cwd services/verifier/hns audit:activated-public-dns | tee dns-audit-report.json

      - name: Reflect activated DNS drift
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          AUDIT_OUTCOME: ${{ steps.dns_audit.outcome }}
        with:
          script: |
            const fs = require("node:fs");
            const title = "HNS activated-root DNS drift detected";
            const marker = "<!-- hns-activated-dns-audit -->";
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "all",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);
            if (process.env.AUDIT_OUTCOME === "success") {
              if (existing?.state === "open") {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: "closed",
                });
              }
              return;
            }
            const report = fs.existsSync("dns-audit-report.json")
              ? fs.readFileSync("dns-audit-report.json", "utf8").slice(0, 50000)
              : "The audit stopped before producing a report.";
            const body = `${marker}\n\nThe scheduled, read-only activated-root DNS audit failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n\`\`\`json\n${report}\n\`\`\``;
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
                state: "open",
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Require a clean activated DNS audit
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.dns_audit.outcome }}
        run: test "$AUDIT_OUTCOME" = "success"

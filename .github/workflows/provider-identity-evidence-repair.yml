name: Provider identity evidence repair

on:
  workflow_dispatch:
    inputs:
      decision_ref:
        description: Reviewed decision/reference for this one-shot repair
        required: true
        type: string
      mode:
        description: Dry-run first; execute only after reviewing the uploaded snapshot
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - execute

concurrency:
  group: provider-identity-evidence-repair-production
  cancel-in-progress: false

jobs:
  repair:
    name: Reconcile provider identity evidence (read-only or approved write)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require main branch dispatch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Dispatch this repair from main only."
            exit 1
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10

      - name: Validate reviewed inputs
        shell: bash
        env:
          DECISION_REF: ${{ inputs.decision_ref }}
        run: |
          set -euo pipefail
          [[ "$DECISION_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]{2,159}$ ]] || {
            echo "::error::decision_ref has an invalid format"
            exit 1
          }

      - name: Fetch production control-plane credential through OIDC
        env:
          # Existing Core production migration identity, shared by the
          # read-only doctor and reviewed repair workflows.
          INFISICAL_IDENTITY_ID: ec0ad659-af1c-4009-a845-9e6092cc062b
          INFISICAL_PROJECT_ID: 5acea78e-7813-4d8a-b29c-9b862a0b1c71
          INFISICAL_ENV: prod
          INFISICAL_SECRET_PATH: /services/api
          SECRET_NAMES: CONTROL_PLANE_DATABASE_URL
        run: scripts/ci/fetch-infisical-secrets.sh

      - name: Run read-only before audit
        run: |
          set -euo pipefail
          bun scripts/control-plane/audit-provider-identity-evidence.ts \
            --database-url-env CONTROL_PLANE_DATABASE_URL \
            > provider-identity-evidence-before.json

      - name: Run reviewed reconciliation
        env:
          DECISION_REF: ${{ inputs.decision_ref }}
          REPAIR_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          args=(
            scripts/control-plane/provider-identity-evidence-repair.ts
            --database-url-env CONTROL_PLANE_DATABASE_URL
            --audit-before-file provider-identity-evidence-before.json
            --snapshot-file provider-identity-evidence-repair-snapshot.json
            --decision-ref "$DECISION_REF"
          )
          if [[ "$REPAIR_MODE" == "execute" ]]; then
            args+=(--execute --confirm-repair provider-identity-evidence)
          fi
          bun "${args[@]}"

      - name: Run read-only after audit
        if: always()
        run: |
          set -euo pipefail
          bun scripts/control-plane/audit-provider-identity-evidence.ts \
            --database-url-env CONTROL_PLANE_DATABASE_URL \
            > provider-identity-evidence-after.json

      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provider-identity-evidence-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            provider-identity-evidence-before.json
            provider-identity-evidence-after.json
            provider-identity-evidence-repair-snapshot.json
          if-no-files-found: warn
          retention-days: 14

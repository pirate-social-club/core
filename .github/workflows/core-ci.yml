name: core-ci

on:
  pull_request:
    paths:
      - ".github/workflows/core-ci.yml"
      - "db/control-plane/migrations/**"
      - "db/known-community-migration-drifts.json"
      - "db/local-control-plane-migration-drifts.json"
      - "db/community-template/migrations/**"
      - "db/bookings/migrations/**"
      - "db/promotion/migrations/**"
      - "references/templates/api-worker-auth-first-slice/**"
      - "scripts/community/**"
      - "scripts/check-migration-integrity.mjs"
      - "scripts/control-plane/**"
      - "scripts/control-plane/apply-postgres-migrations.ts"
      - "scripts/lib/postgres-migrations.ts"
      - "scripts/bookings/**"
      - "packages/hns-delegation/**"
      - "services/verifier/hns/**"
      - "specs/api/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/core-ci.yml"
      - "db/control-plane/migrations/**"
      - "db/known-community-migration-drifts.json"
      - "db/local-control-plane-migration-drifts.json"
      - "db/community-template/migrations/**"
      - "db/bookings/migrations/**"
      - "db/promotion/migrations/**"
      - "references/templates/api-worker-auth-first-slice/**"
      - "scripts/community/**"
      - "scripts/check-migration-integrity.mjs"
      - "scripts/control-plane/**"
      - "scripts/control-plane/apply-postgres-migrations.ts"
      - "scripts/lib/postgres-migrations.ts"
      - "scripts/bookings/**"
      - "packages/hns-delegation/**"
      - "services/verifier/hns/**"
      - "specs/api/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  openapi:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Start iron-proxy egress audit
        uses: ironsh/iron-proxy-action@fa1fd82ec32396d044deba7040a6db576bec927a
        with:
          egress-rules: egress-rules.yaml
          warn: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.21

      - name: Detect spec artifact inputs
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "spec_artifacts=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="origin/${{ github.base_ref }}"
          else
            base_ref="${{ github.event.before }}"
          fi

          if [ -z "$base_ref" ] || [ "$base_ref" = "0000000000000000000000000000000000000000" ]; then
            base_ref="HEAD~1"
          fi

          if git diff --name-only "$base_ref"...HEAD -- \
              specs/api \
              references/templates/api-worker-auth-first-slice |
            grep -q .; then
            echo "spec_artifacts=true" >> "$GITHUB_OUTPUT"
          else
            echo "spec_artifacts=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install spec dependencies
        if: steps.changed.outputs.spec_artifacts == 'true'
        working-directory: specs/api
        run: bun install --frozen-lockfile

      - name: Run repo hygiene checks
        run: npm run check

      - name: Check migration integrity
        run: npm run check:migrations

      - name: Audit core dependencies
        run: npm audit --audit-level=high

      # @pirate/hns-delegation gates authenticated HNS routing and is consumed by
      # the API repo. `bun test` transpiles past type errors, so tests alone let
      # a broken return contract ship green.
      - name: Typecheck @pirate/hns-delegation
        run: |
          bun install --cwd packages/hns-delegation --frozen-lockfile
          bun run --cwd packages/hns-delegation typecheck

      - name: Test @pirate/hns-delegation
        run: bun test packages/hns-delegation/tests

      - name: Validate community-template migrations against fresh SQLite
        run: |
          mkdir -p /tmp/pirate-migration-test
          ./scripts/community/apply-sqlite-migrations.sh \
            --db /tmp/pirate-migration-test/community.db \
            --migrations db/community-template/migrations

      # Full `bun run verify` is intentionally excluded here because it writes
      # generated contracts into the standalone API sidecar when available.
      - name: Rebuild core-owned spec artifacts
        if: steps.changed.outputs.spec_artifacts == 'true'
        run: |
          bun specs/api/scripts/bundle-openapi.ts
          bun specs/api/scripts/bundle-openapi-implemented.ts
          bun specs/api/scripts/generate-reference-template-types.ts
          bun run --cwd specs/api typecheck
          bun specs/api/scripts/validate-provider-matrix.ts
          bun specs/api/scripts/validate-openapi-examples.ts

      - name: Fail on uncommitted generated changes
        if: steps.changed.outputs.spec_artifacts == 'true'
        run: |
          git diff --exit-code -- \
            specs/api/openapi.yaml \
            specs/api/openapi-implemented.yaml \
            references/templates/api-worker-auth-first-slice/src/types/api.ts

      # Keep the foreign checkout after every repository-wide scanner and
      # generated-diff check so Web files cannot contaminate Core hygiene.
      - name: Check out shared dependency audit
        if: steps.changed.outputs.spec_artifacts == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/web
          ref: 84b20c9a90dd7f32f1141684795b2c08c3dcfea3
          path: .dependency-audit

      - name: Audit spec dependencies
        if: steps.changed.outputs.spec_artifacts == 'true'
        run: |
          node .dependency-audit/scripts/ci/dependency-audit.mjs \
            --mode scheduled \
            --baseline .dependency-audit/.github/dependency-audit-baseline.json \
            --target specs/api:bun

      - name: Show iron-proxy egress summary
        uses: ironsh/iron-proxy-action/summary@fa1fd82ec32396d044deba7040a6db576bec927a
        if: always()

  bookings-migration:
    # Real-Postgres integration test for the global bookings schema (b0001…): provisions PostgreSQL 17,
    # bootstraps the extension + roles as owner, runs the real runner as the non-superuser migrator, and
    # asserts ledger/replay/grants/default-privileges/constraints. Uses the service's published port.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.21

      - name: Run bookings migration integration test
        env:
          # Owner/superuser URL to the service; the test creates its own isolated db + roles + extension.
          BOOKINGS_MIGRATION_TEST_ADMIN_URL: "postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable"
        run: bun test scripts/bookings/migration-integration.test.ts

      - name: Run HNS root delegation migration integration test
        env:
          # Proves PostgreSQL accepts the canonical read query and enforces the
          # delegation invariants, which string assertions cannot.
          CONTROL_PLANE_MIGRATION_TEST_ADMIN_URL: "postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable"
        run: bun test scripts/control-plane/hns-root-delegation-migration.test.ts

      - name: Run operator credentials migration integration test
        env:
          # Owner/superuser URL to the service; the test creates its own isolated db + roles.
          CONTROL_PLANE_MIGRATION_TEST_ADMIN_URL: "postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable"
        run: bun test scripts/control-plane/operator-credentials-migration.test.ts

      - name: Run dance choreography migration integration test
        env:
          # Proves ready completeness, revision immutability, and scoped activation in PostgreSQL.
          CONTROL_PLANE_MIGRATION_TEST_ADMIN_URL: "postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable"
        run: bun test scripts/control-plane/dance-choreography-migration.test.ts

      - name: Run PostgreSQL migration-lock integration test
        env:
          # Proves the runner pins one backend and serializes complete invocations.
          CONTROL_PLANE_MIGRATION_TEST_ADMIN_URL: "postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable"
        run: bun test scripts/control-plane/postgres-migration-lock.test.ts

      - name: Run promotion shadow migration integration test
        env:
          CONTROL_PLANE_MIGRATION_TEST_ADMIN_URL: "postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable"
        run: bun test scripts/control-plane/promotion-shadow-migration.test.ts

NftGateCapabilitySource:
  type: object
  additionalProperties: false
  required:
    - id
    - label
    - chain_namespace
    - contract_address
    - standard
    - trait_filters_supported
    - facet_keys
    - max_values_per_facet
    - min_quantity_supported
  properties:
    id:
      type: string
      minLength: 1
      maxLength: 128
      description: Stable Pirate source identifier; never a vendor index name.
    label:
      type: string
      minLength: 1
      maxLength: 160
    chain_namespace:
      type: string
      minLength: 1
      maxLength: 128
      description: CAIP-2 chain namespace.
    contract_address:
      type: string
      minLength: 1
      maxLength: 128
    standard:
      type: string
      enum:
        - erc721
        - erc1155
    trait_filters_supported:
      type: boolean
    facet_keys:
      type: array
      maxItems: 32
      uniqueItems: true
      items:
        type: string
        minLength: 1
        maxLength: 64
    facet_labels:
      type: object
      additionalProperties:
        type: string
        minLength: 1
        maxLength: 80
    max_values_per_facet:
      type: integer
      minimum: 1
      maximum: 10
    inventory_provider:
      type: string
      nullable: true
      description: Legacy evaluation provider identifier; omitted for collection-only sources.
    fixed_match:
      $ref: ./gate-capabilities.yaml#/NftGateInventoryMatch
    min_quantity_supported:
      type: boolean

NftGateInventoryMatch:
  type: object
  maxProperties: 32
  additionalProperties:
    oneOf:
      - type: string
        minLength: 1
        maxLength: 200
      - type: array
        minItems: 1
        maxItems: 10
        uniqueItems: true
        items:
          type: string
          minLength: 1
          maxLength: 200

NftGateCapabilitySourceListResponse:
  type: object
  additionalProperties: false
  required:
    - sources
  properties:
    sources:
      type: array
      maxItems: 100
      items:
        $ref: ./gate-capabilities.yaml#/NftGateCapabilitySource

NftGateFacetValue:
  type: object
  additionalProperties: false
  required:
    - value
  properties:
    value:
      type: string
      minLength: 1
      maxLength: 200
    approximate_count:
      type: integer
      format: int64
      minimum: 0

NftGateFacetValuePage:
  type: object
  additionalProperties: false
  required:
    - values
    - next_cursor
    - catalog_fetched_at
  properties:
    values:
      type: array
      maxItems: 50
      items:
        $ref: ./gate-capabilities.yaml#/NftGateFacetValue
    next_cursor:
      type: string
      nullable: true
      maxLength: 512
    catalog_fetched_at:
      type: string
      format: date-time

NftGateCatalogUnavailableResponse:
  type: object
  additionalProperties: false
  required:
    - code
    - message
    - retryable
  properties:
    code:
      type: string
      enum:
        - nft_gate_catalog_unavailable
    message:
      type: string
    retryable:
      type: boolean
      enum:
        - true

SongStudyAccessState:
  type: string
  description: |
    Authoritative access decision for a song's study pack, made server-side.
    The client never derives this from post payload shape.
      - `ready`       — caller may study; exercise content is included.
      - `locked`      — post exists but access is denied. Returned INSTEAD of
                        404 so the client can render the locked study surface.
                        Paired with `locked_reason`.
      - `processing`  — no safe local exercises are ready yet and server-side
                        preparation is pending. In v1, normal first-load lazy
                        generation returns `ready` with say-it-back exercises
                        while translation choices are prepared asynchronously.
      - `unavailable` — the song cannot support study. Paired with
                        `unavailable_reason`. No exercise content.
  enum:
    - ready
    - locked
    - processing
    - unavailable

SongStudyLockedReason:
  type: string
  description: Why a study pack is `locked`. Present only when `access` is `locked`.
  enum:
    - purchase_required
    - membership_required
    - age_required

SongStudyUnavailableReason:
  type: string
  description: Why a study pack is `unavailable`. Present only when `access` is `unavailable`.
  enum:
    - not_song
    - no_lyrics
    - unsupported_language
    - generation_failed
    - missing_transcription_provider

SongStudyExercise:
  description: |
    A single study exercise. `line_id` is STABLE across fetches and, together
    with the exercise `type` and the payload's source/target language pair,
    forms the spaced-repetition (FSRS) review-unit key. `line_index` is
    presentation order only and carries no scheduling meaning.

    Answer-integrity contract: no exercise variant carries the correct answer.
    For `translation_choice` the `options` array is server-shuffled and the
    correct option is NOT identified here — the client renders options in array
    order and submits a choice to `POST .../study/attempts` for server-side
    validation. For `say_it_back`, `reference_text` is the visible target line
    (legitimately visible to an entitled learner); grading of the spoken
    transcript is performed server-side by the attempts endpoint, which owns
    normalization and the set of accepted variants.
  oneOf:
    - type: object
      title: SongStudySayItBackExercise
      required:
        - id
        - type
        - line_id
        - line_index
        - prompt_text
        - reference_text
        - max_attempts
        - presentation_count
        - mastered
        - first_outcome
      properties:
        id:
          type: string
          description: Opaque, stable exercise identifier.
        type:
          type: string
          enum:
            - say_it_back
        line_id:
          type: string
          description: |
            Stable lyric-line identifier. Stable across fetches and pack
            versions for the same underlying line; the FSRS review-unit key.
        line_index:
          type: integer
          description: Presentation order only. Not a scheduling signal.
        prompt_text:
          type: string
          description: |
            What is shown/played to the learner (e.g. the line to read back, or
            a translation to produce from). May equal `reference_text` for a
            read-back exercise.
        reference_text:
          type: string
          description: |
            The visible target line the learner is asked to produce. NOT a
            grading secret: it is the lyric line, which is already visible to an
            entitled learner. The authoritative grade comes from the attempts
            endpoint, not from a client-side comparison against this value.
        translation_text:
          type: string
          nullable: true
          description: Optional translation of the line in the target language.
        max_attempts:
          type: integer
          description: |
            Maximum presentations of this card within the server-issued session.
        presentation_count:
          type: integer
          description: Number of accepted presentations already recorded in this session.
        mastered:
          type: boolean
          description: Whether the learner has answered this card correctly in this session.
        first_outcome:
          type: string
          nullable: true
          enum: [correct, incorrect, revealed]
      additionalProperties: false
    - type: object
      title: SongStudyTranslationChoiceExercise
      required:
        - id
        - type
        - line_id
        - line_index
        - prompt_text
        - question
        - options
        - max_attempts
        - presentation_count
        - mastered
        - first_outcome
      properties:
        id:
          type: string
          description: Opaque, stable exercise identifier.
        type:
          type: string
          enum:
            - translation_choice
        line_id:
          type: string
          description: Stable lyric-line identifier; the FSRS review-unit key.
        line_index:
          type: integer
          description: Presentation order only.
        prompt_text:
          type: string
          description: The source line being asked about.
        question:
          type: string
          description: |
            Instruction shown to the learner (e.g. "Translate:"). A free string
            for localization rather than a fixed literal.
        options:
          type: array
          description: |
            Candidate answers, SERVER-shuffled. The correct option is NOT
            identified. The client renders options in array order and MUST NOT
            re-sort or shuffle them.
          items:
            type: object
            required:
              - id
              - text
            properties:
              id:
                type: string
              text:
                type: string
            additionalProperties: false
        max_attempts:
          type: integer
          description: Maximum presentations of this card within the server-issued session.
        presentation_count:
          type: integer
          description: Number of accepted presentations already recorded in this session.
        mastered:
          type: boolean
          description: Whether the learner has answered this card correctly in this session.
        first_outcome:
          type: string
          nullable: true
          enum: [correct, incorrect, revealed]
      additionalProperties: false

SongStudySessionSummary:
  type: object
  required:
    - id
    - status
    - due_count
    - served_count
    - total_units
    - required_correct_count
    - max_presentations
    - presentation_count
    - completed_exercise_count
    - first_pass_correct_count
    - mastered_exercise_count
    - qualified
  properties:
    id:
      type: string
      nullable: true
      description: Server-issued session identifier. Null only in the caught-up state.
    status:
      type: string
      enum: [active, completed, caught_up, expired]
    due_count:
      type: integer
      description: |
        Number of exercises due under the currently enabled session-builder
        policy, before any future cap. During the staged rollout this excludes
        already-attempted due reviews until re-serving is explicitly enabled.
    served_count:
      type: integer
      description: Number of exercises returned in this payload.
    total_units:
      type: integer
      description: Total currently available study exercises for this song and target language.
    required_correct_count:
      type: integer
      description: First-presentation correct answers required for qualification.
    max_presentations:
      type: integer
      description: Hard cap across original cards and mistake repetitions.
    presentation_count:
      type: integer
    completed_exercise_count:
      type: integer
      description: Distinct cards presented at least once.
    first_pass_correct_count:
      type: integer
    mastered_exercise_count:
      type: integer
      description: Distinct cards eventually answered correctly.
    qualified:
      type: boolean
    next_due_at:
      type: integer
      format: int64
      description: |
        Unix seconds for the next reviewed exercise that becomes due. Present
        only when there are no new cards and no due cards in the current
        session-builder policy.
  additionalProperties: false

SongStudyPayload:
  type: object
  description: |
    Canonical study pack for one song post. The `access` field is the SOLE
    authority on whether the caller may study and whether exercise content is
    present; clients must not re-derive access from the post payload.

    Always-safe metadata (`title`, `artist_name`, `artwork_src`, the language
    pair) is returned in EVERY access state so the locked/processing surfaces
    can show context. Lyric / translation / option text appears only when
    `access` is `ready` (see normative invariants in specs/domain/song-study.md).
    A ready pack may initially contain only say-it-back exercises; translation
    choices can appear on later fetches after the async generation job succeeds.

    Scope: this is one song's study queue. It contains both first-learn
    exercises not yet attempted by the learner and due FSRS review exercises
    for this song. Cross-song "due today" sessions are a separate concern.
  required:
    - object
    - post_id
    - community_id
    - access
    - title
    - exercise_count
    - exercises
  properties:
    object:
      type: string
      enum:
        - song_study_payload
    post_id:
      type: string
    community_id:
      type: string
    access:
      $ref: "#/components/schemas/SongStudyAccessState"
    title:
      type: string
      description: Always returned (also present on the post card).
    artist_name:
      type: string
      nullable: true
      description: Always-safe metadata; may be returned in any access state.
    artwork_src:
      type: string
      nullable: true
      description: Always-safe metadata; may be returned in any access state.
    source_language:
      type: string
      nullable: true
      description: |
        BCP-47 language of the lyrics. Echoed in every access state so the
        locked/processing surfaces can label the pair. Part of the FSRS key.
    target_language:
      type: string
      nullable: true
      description: |
        BCP-47 study target language (echo of the resolved `target_language`
        query, or the caller's content locale). Part of the FSRS key.
    exercise_count:
      type: integer
      description: |
        Number of exercises. MUST equal `exercises.length`. Zero whenever
        `access` is not `ready`.
    exercises:
      type: array
      description: |
        Exercises, in presentation order. Empty whenever `access` is not
        `ready`. Never contains lyric/translation/option text for a
        non-`ready` pack.
      items:
        $ref: "#/components/schemas/SongStudyExercise"
    session:
      $ref: "#/components/schemas/SongStudySessionSummary"
    study_pack_version:
      type: integer
      description: |
        Generation version of this pack. Bump when generation logic or
        distractor selection changes so cached packs and historical attempts
        can be compared/invalidated. Present only when `access` is `ready`.
    generated_at:
      type: integer
      format: int64
      description: |
        Unix seconds at which this pack was generated. Present only when
        `access` is `ready`.
    locked_reason:
      $ref: "#/components/schemas/SongStudyLockedReason"
    unavailable_reason:
      $ref: "#/components/schemas/SongStudyUnavailableReason"
  additionalProperties: false

SongStudyAttemptRequest:
  type: object
  description: |
    A single attempt at one exercise. Exactly one of `selected_option_id`
    (translation_choice) or `transcript` (say_it_back) must be present, matching
    `type`. The server validates the answer, records the attempt EVENT (not just
    final state), advances the FSRS schedule, and returns the verdict.

    Attempt writes are idempotent. Reusing the same `idempotency_key` for the
    same equivalent request returns the original result; conflicting reuse is
    rejected. Retries must not double-record an event or double-advance FSRS.
  required:
    - idempotency_key
    - session_id
    - exercise_id
    - type
    - attempt_number
  properties:
    idempotency_key:
      type: string
      description: |
        Client-generated idempotency key for this attempt write. Scoped to the
        authenticated user; equivalent retries return the original result and
        conflicting reuse is rejected.
    session_id:
      type: string
      description: Server-issued session containing this exercise and its fixed language/targets.
    exercise_id:
      type: string
    type:
      type: string
      enum:
        - say_it_back
        - translation_choice
    attempt_number:
      type: integer
      description: |
        1-based presentation attempt index within the currently served
        exercise instance. It drives grading and reveal behavior; durable
        attempt identity is the idempotency key, not this number.
    selected_option_id:
      type: string
      description: Required for `translation_choice`; omitted otherwise.
    transcript:
      type: string
      description: |
        Final STT transcript for `say_it_back`; omitted otherwise. The server
        owns normalization and the accepted-variant policy.
    timezone:
      type: string
      description: |
        Learner's device IANA timezone (e.g. `America/New_York`). Used for
        streak day boundaries: pinned on the learner's first qualification and
        changeable at most once per 7 days. Optional; falls back to the
        edge-derived timezone, then UTC.
  additionalProperties: false

SongStudyAttemptResult:
  type: object
  description: |
    Server verdict for one submitted attempt. The correct answer is disclosed
    only once the attempt is spent (a correct answer, or an incorrect final
    attempt) so the answer is never resident in the client before then.
  required:
    - object
    - exercise_id
    - outcome
    - attempts_remaining
  properties:
    object:
      type: string
      enum:
        - song_study_attempt_result
    exercise_id:
      type: string
    outcome:
      type: string
      enum:
        - correct
        - incorrect
        - revealed
      description: |
        `revealed` is returned when the final attempt was incorrect and the
        answer is now disclosed.
    attempts_remaining:
      type: integer
    correct_option_id:
      type: string
      description: |
        For `translation_choice`, the correct option. Returned after every
        accepted presentation so an incorrect answer can show its correction
        before the card is requeued.
    feedback:
      type: object
      description: |
        Token-level diff for `say_it_back`, computed server-side under the
        source lyric language's tokenization / accent / punctuation policy.
      properties:
        matched:
          type: array
          items:
            type: string
        missing:
          type: array
          items:
            type: string
        extra:
          type: array
          items:
            type: string
      additionalProperties: false
    next_review_hint:
      type: string
      enum:
        - again
        - hard
        - good
        - easy
      description: |
        Optional human-facing hint derived from the server FSRS update. FSRS
        scheduling itself is server-internal; the client does not compute it.
    session:
      $ref: "#/components/schemas/SongStudySessionSummary"
    study_progress:
      type: object
      description: |
        Server-owned Study progress after this attempt. Present when Study
        streak writes are enabled. This lets clients render completion/streak
        state without deriving streak qualification locally.
      properties:
        study_attempt_count:
          type: integer
        study_correct_count:
          type: integer
        study_target_count:
          type: integer
        qualified_today:
          type: boolean
        current_streak:
          type: integer
          description: |
            The projected streak count after today's qualification is
            materialized. Zero when the learner has no active streak.
        next_due_at:
          type: integer
          description: Unix timestamp for the next due Study review, when known.
      required:
        - study_attempt_count
        - study_correct_count
        - study_target_count
        - qualified_today
        - current_streak
      additionalProperties: false
  additionalProperties: false

SongStudyTranscriptionResponse:
  type: object
  description: |
    Final transcript for one say-it-back recording. Raw audio is not stored by
    Pirate. The transcript is not itself a grade; clients submit it to
    `POST .../study/attempts` for server-authoritative grading and FSRS update.
  required:
    - object
    - provider
    - model
    - text
  properties:
    object:
      type: string
      enum:
        - song_study_transcription
    provider:
      type: string
      enum:
        - elevenlabs
    model:
      type: string
    text:
      type: string
    confidence:
      type: number
      nullable: true
    language_code:
      type: string
      nullable: true
    language_probability:
      type: number
      nullable: true
    duration_seconds:
      type: number
      nullable: true
  additionalProperties: false

TelegramStudyVoiceIntentRequest:
  type: object
  required:
    - exercise_id
  properties:
    exercise_id:
      type: string
      minLength: 1
    target_language:
      type: string
      nullable: true
  additionalProperties: false

TelegramStudyVoiceIntent:
  type: object
  required:
    - created
    - expires_at
    - id
    - object
    - status
  properties:
    created:
      type: integer
      format: int64
    expires_at:
      type: integer
      format: int64
    id:
      type: string
    object:
      type: string
      enum:
        - telegram_study_voice_intent
    status:
      type: string
      enum:
        - pending
  additionalProperties: false

SongStudyAccessState:
  type: string
  description: |
    Authoritative access decision for a song's study pack, made server-side.
    The client never derives this from post payload shape.
      - `ready`       — caller may study; exercise content is included.
      - `locked`      — post exists but access is denied. Returned INSTEAD of
                        404 so the client can render the locked study surface.
                        Paired with `locked_reason`.
      - `processing`  — no safe local exercises are ready yet and server-side
                        preparation is pending. In v1, normal first-load lazy
                        generation returns `ready` with say-it-back exercises
                        while translation choices are prepared asynchronously.
      - `unavailable` — the song cannot support study. Paired with
                        `unavailable_reason`. No exercise content.
  enum:
    - ready
    - locked
    - processing
    - unavailable

SongStudyLockedReason:
  type: string
  description: Why a study pack is `locked`. Present only when `access` is `locked`.
  enum:
    - purchase_required
    - membership_required
    - age_required

SongStudyUnavailableReason:
  type: string
  description: Why a study pack is `unavailable`. Present only when `access` is `unavailable`.
  enum:
    - not_song
    - no_lyrics
    - unsupported_language
    - generation_failed
    - missing_transcription_provider

SongStudyExercise:
  description: |
    A single study exercise. `line_id` is STABLE across fetches and, together
    with the exercise `type` and the payload's source/target language pair,
    forms the spaced-repetition (FSRS) review-unit key. `line_index` is
    presentation order only and carries no scheduling meaning.

    Answer-integrity contract: no exercise variant carries the correct answer.
    For `translation_choice` the `options` array is server-shuffled and the
    correct option is NOT identified here — the client renders options in array
    order and submits a choice to `POST .../study/attempts` for server-side
    validation. For `fill_blank`, render segments and word-bank tokens are
    server-ordered while the correct placements remain withheld. For
    `say_it_back`, `reference_text` is the visible target line
    (legitimately visible to an entitled learner); grading of the spoken
    transcript is performed server-side by the attempts endpoint, which owns
    normalization and the set of accepted variants.
  oneOf:
    - type: object
      title: SongStudySayItBackExercise
      required:
        - id
        - type
        - line_id
        - line_index
        - prompt_text
        - reference_text
        - max_attempts
        - presentation_count
        - mastered
        - first_outcome
      properties:
        id:
          type: string
          description: Opaque, stable exercise identifier.
        type:
          type: string
          enum:
            - say_it_back
        line_id:
          type: string
          description: |
            Stable lyric-line identifier. Stable across fetches and pack
            versions for the same underlying line; the FSRS review-unit key.
        line_index:
          type: integer
          description: Presentation order only. Not a scheduling signal.
        prompt_text:
          type: string
          description: |
            What is shown/played to the learner (e.g. the line to read back, or
            a translation to produce from). May equal `reference_text` for a
            read-back exercise.
        reference_text:
          type: string
          description: |
            The visible target line the learner is asked to produce. NOT a
            grading secret: it is the lyric line, which is already visible to an
            entitled learner. The authoritative grade comes from the attempts
            endpoint, not from a client-side comparison against this value.
        translation_text:
          type: string
          nullable: true
          description: Optional translation of the line in the target language.
        max_attempts:
          type: integer
          description: |
            Maximum presentations of this card within the server-issued session.
        presentation_count:
          type: integer
          description: Number of accepted presentations already recorded in this session.
        mastered:
          type: boolean
          description: Whether the learner has answered this card correctly in this session.
        first_outcome:
          type: string
          nullable: true
          enum: [correct, incorrect, revealed]
      additionalProperties: false
    - type: object
      title: SongStudyFillBlankExercise
      required:
        - id
        - type
        - line_id
        - line_index
        - prompt_text
        - segments
        - tokens
        - max_attempts
        - presentation_count
        - mastered
        - first_outcome
      properties:
        id:
          type: string
          description: Opaque, stable exercise identifier.
        type:
          type: string
          enum:
            - fill_blank
        line_id:
          type: string
          description: Stable lyric-line identifier; the FSRS review-unit key.
        line_index:
          type: integer
          description: Presentation order only.
        prompt_text:
          type: string
          description: Instruction shown above the cloze lyric.
        segments:
          type: array
          description: |
            Ordered render segments for the lyric. A blank segment identifies a
            placement slot but never identifies its correct token.
          items:
            oneOf:
              - type: object
                required: [kind, text]
                properties:
                  kind:
                    type: string
                    enum: [text]
                  text:
                    type: string
                additionalProperties: false
              - type: object
                required: [kind, id]
                properties:
                  kind:
                    type: string
                    enum: [blank]
                  id:
                    type: string
                additionalProperties: false
        tokens:
          type: array
          description: |
            Server-shuffled word bank. The client renders this exact order and
            submits token-to-blank placements without deriving correctness.
          items:
            type: object
            required: [id, text]
            properties:
              id:
                type: string
              text:
                type: string
            additionalProperties: false
        max_attempts:
          type: integer
          description: Maximum presentations of this card within the server-issued session.
        presentation_count:
          type: integer
          description: Number of accepted presentations already recorded in this session.
        mastered:
          type: boolean
          description: Whether the learner has answered this card correctly in this session.
        first_outcome:
          type: string
          nullable: true
          enum: [correct, incorrect, revealed]
      additionalProperties: false
    - type: object
      title: SongStudyTranslationChoiceExercise
      required:
        - id
        - type
        - line_id
        - line_index
        - prompt_text
        - question
        - options
        - max_attempts
        - presentation_count
        - mastered
        - first_outcome
      properties:
        id:
          type: string
          description: Opaque, stable exercise identifier.
        type:
          type: string
          enum:
            - translation_choice
        line_id:
          type: string
          description: Stable lyric-line identifier; the FSRS review-unit key.
        line_index:
          type: integer
          description: Presentation order only.
        prompt_text:
          type: string
          description: The source line being asked about.
        question:
          type: string
          description: |
            Instruction shown to the learner (e.g. "Translate:"). A free string
            for localization rather than a fixed literal.
        options:
          type: array
          description: |
            Candidate answers, SERVER-shuffled. The correct option is NOT
            identified. The client renders options in array order and MUST NOT
            re-sort or shuffle them.
          items:
            type: object
            required:
              - id
              - text
            properties:
              id:
                type: string
              text:
                type: string
            additionalProperties: false
        max_attempts:
          type: integer
          description: Maximum presentations of this card within the server-issued session.
        presentation_count:
          type: integer
          description: Number of accepted presentations already recorded in this session.
        mastered:
          type: boolean
          description: Whether the learner has answered this card correctly in this session.
        first_outcome:
          type: string
          nullable: true
          enum: [correct, incorrect, revealed]
      additionalProperties: false

SongStudySessionSummary:
  type: object
  example:
    id: sts_example
    status: active
    due_count: 0
    served_count: 10
    total_units: 10
    required_correct_count: 7
    max_presentations: 20
    presentation_count: 7
    completed_exercise_count: 7
    resolved_exercise_count: 4
    first_pass_correct_count: 4
    mastered_exercise_count: 4
    qualified: false
    session_revision: 7
    completion_reason: null
  required:
    - id
    - status
    - due_count
    - served_count
    - total_units
    - required_correct_count
    - max_presentations
    - presentation_count
    - completed_exercise_count
    - resolved_exercise_count
    - completion_reason
    - first_pass_correct_count
    - mastered_exercise_count
    - qualified
    - session_revision
  properties:
    id:
      type: string
      nullable: true
      description: Server-issued session identifier. Null only in the caught-up state.
    status:
      type: string
      enum: [active, completed, caught_up, expired]
    due_count:
      type: integer
      description: |
        Number of exercises due under the currently enabled session-builder
        policy, before any future cap. During the staged rollout this excludes
        already-attempted due reviews until re-serving is explicitly enabled.
    served_count:
      type: integer
      description: Number of exercises returned in this payload.
    total_units:
      type: integer
      description: Total currently available study exercises for this song and target language.
    required_correct_count:
      type: integer
      description: First-presentation correct answers required for qualification.
    max_presentations:
      type: integer
      description: Hard cap across original cards and mistake repetitions.
    presentation_count:
      type: integer
    completed_exercise_count:
      type: integer
      minimum: 0
      description: Distinct cards presented at least once.
    resolved_exercise_count:
      type: integer
      minimum: 0
      description: Cards resolved for this lesson, independently of mastery or future review due state.
    first_pass_correct_count:
      type: integer
    mastered_exercise_count:
      type: integer
      minimum: 0
      description: Distinct cards eventually answered correctly.
    session_revision:
      type: integer
      minimum: 0
      description: Server orchestration revision used for optional optimistic concurrency.
    completion_reason:
      type: string
      nullable: true
      enum: [all_resolved, presentation_budget]
      description: Why the lesson closed; null while it remains active.
    qualified:
      type: boolean
    next_due_at:
      type: integer
      format: int64
      description: |
        Unix seconds for the next reviewed exercise that becomes due. Present
        only when there are no new cards and no due cards in the current
        session-builder policy.
  additionalProperties: false

SongStudyPayload:
  type: object
  description: |
    Canonical study pack for one song post. The `access` field is the SOLE
    authority on whether the caller may study and whether exercise content is
    present; clients must not re-derive access from the post payload.

    Always-safe metadata (`title`, `artist_name`, `artwork_src`, the language
    pair) is returned in EVERY access state so the locked/processing surfaces
    can show context. Lyric / translation / option text appears only when
    `access` is `ready` (see normative invariants in specs/domain/song-study.md).
    A ready pack may initially contain only say-it-back exercises; translation
    choices can appear on later fetches after the async generation job succeeds.

    Scope: this is one song's study queue. It contains both first-learn
    exercises not yet attempted by the learner and due FSRS review exercises
    for this song. Cross-song "due today" sessions are a separate concern.
  required:
    - object
    - post_id
    - community_id
    - access
    - title
    - exercise_count
    - exercises
  properties:
    object:
      type: string
      enum:
        - song_study_payload
    post_id:
      type: string
    community_id:
      type: string
    access:
      $ref: "#/components/schemas/SongStudyAccessState"
    title:
      type: string
      description: Always returned (also present on the post card).
    artist_name:
      type: string
      nullable: true
      description: Always-safe metadata; may be returned in any access state.
    artwork_src:
      type: string
      nullable: true
      description: Always-safe metadata; may be returned in any access state.
    source_language:
      type: string
      nullable: true
      description: |
        BCP-47 language of the lyrics. Echoed in every access state so the
        locked/processing surfaces can label the pair. Part of the FSRS key.
    target_language:
      type: string
      nullable: true
      description: |
        BCP-47 study target language (echo of the resolved `target_language`
        query, or the caller's content locale). Part of the FSRS key.
    exercise_count:
      type: integer
      description: |
        Number of exercises. MUST equal `exercises.length`. Zero whenever
        `access` is not `ready`.
    exercises:
      type: array
      description: |
        Exercises, in presentation order. Empty whenever `access` is not
        `ready`. Never contains lyric/translation/option text for a
        non-`ready` pack.
      items:
        $ref: "#/components/schemas/SongStudyExercise"
    session:
      $ref: "#/components/schemas/SongStudySessionSummary"
    lesson:
      $ref: "#/components/schemas/SongStudyLessonState"
      description: |
        Present for an active or just-completed orchestration-v2 session. This
        is the same render-safe projection returned after an attempt and in a
        stale-revision conflict.
    study_pack_version:
      type: integer
      description: |
        Generation version of this pack. Bump when generation logic or
        distractor selection changes so cached packs and historical attempts
        can be compared/invalidated. Present only when `access` is `ready`.
    generated_at:
      type: integer
      format: int64
      description: |
        Unix seconds at which this pack was generated. Present only when
        `access` is `ready`.
    locked_reason:
      $ref: "#/components/schemas/SongStudyLockedReason"
    unavailable_reason:
      $ref: "#/components/schemas/SongStudyUnavailableReason"
  additionalProperties: false

SongStudyAttemptRequest:
  type: object
  description: |
    A single attempt at one exercise. Exactly one of `selected_option_id`
    (translation_choice), `transcript` (say_it_back), or `placements`
    (fill_blank) must be present, matching `type`. The server validates the
    answer, records the attempt EVENT (not just
    final state), advances the FSRS schedule, and returns the verdict.

    Attempt writes are idempotent. Reusing the same `idempotency_key` for the
    same equivalent request returns the original result; conflicting reuse is
    rejected. Retries must not double-record an event or double-advance FSRS.
  required:
    - idempotency_key
    - session_id
    - exercise_id
    - type
    - attempt_number
  properties:
    idempotency_key:
      type: string
      description: |
        Client-generated idempotency key for this attempt write. Scoped to the
        authenticated user; equivalent retries return the original result and
        conflicting reuse is rejected.
    session_id:
      type: string
      description: Server-issued session containing this exercise and its fixed language/targets.
    exercise_id:
      type: string
    type:
      type: string
      enum:
        - say_it_back
        - translation_choice
        - fill_blank
    attempt_number:
      type: integer
      description: |
        1-based presentation attempt index within the currently served
        exercise instance. It drives grading and reveal behavior; durable
        attempt identity is the idempotency key, not this number.
    session_revision:
      type: integer
      minimum: 0
      description: |
        Optional during the orchestration-v2 adoption window. When present,
        this is the last server revision rendered by the client and a stale
        value is rejected without grading. When absent, the server follows the
        legacy no-conflict-check path so already-deployed clients keep working.
    selected_option_id:
      type: string
      description: Required for `translation_choice`; omitted otherwise.
    transcript:
      type: string
      description: |
        Final STT transcript for `say_it_back`; omitted otherwise. The server
        owns normalization and the accepted-variant policy.
    placements:
      type: array
      description: |
        Required for `fill_blank`; omitted otherwise. Contains exactly one
        token assignment for every blank. Order is not significant because
        blank identifiers are explicit.
      items:
        type: object
        required: [blank_id, token_id]
        properties:
          blank_id:
            type: string
          token_id:
            type: string
        additionalProperties: false
    transcription_language_code:
      type: string
      description: |
        Language code returned by the speech-to-text provider for this
        `say_it_back` recording. The server compares it with the exercise's
        source language when the ungradable re-record flag is enabled.
        Omitted for clients that do not have provider language metadata.
    transcription_language_probability:
      type: number
      minimum: 0
      maximum: 1
      description: |
        Provider confidence for `transcription_language_code`, when supplied.
        Omitted when the provider does not return a probability.
    timezone:
      type: string
      description: |
        Learner's device IANA timezone (e.g. `America/New_York`). Used for
        streak day boundaries: pinned on the learner's first qualification and
        changeable at most once per 7 days. Optional; falls back to the
        edge-derived timezone, then UTC.
  additionalProperties: false

SongStudyAttemptResult:
  type: object
  description: |
    Server verdict for one submitted attempt. The correct answer is disclosed
    only once the presentation is spent (a correct answer, or a final incorrect
    answer reported as `revealed`) so the answer is never resident in the client
    beforehand.
  required:
    - object
    - exercise_id
    - outcome
    - attempts_remaining
  properties:
    object:
      type: string
      enum:
        - song_study_attempt_result
    exercise_id:
      type: string
    outcome:
      type: string
      enum:
        - correct
        - incorrect
        - revealed
        - ungradable
      description: |
        `revealed` is returned when the final attempt was incorrect and the
        answer is now disclosed. `ungradable` is a feature-gated free re-record:
        it consumes no graded attempt and keeps the same appearance current.
    attempts_remaining:
      type: integer
    correct_option_id:
      type: string
      description: |
        For `translation_choice`, the correct option. Returned after every
        accepted presentation so an incorrect answer can show its correction
        before the card is requeued.
    correct_placements:
      type: array
      description: |
        For `fill_blank`, the correct token assignment for each blank. Returned
        only after a correct or revealed presentation, never after a retryable
        miss and never in a render-safe prompt.
      items:
        type: object
        required: [blank_id, token_id]
        properties:
          blank_id:
            type: string
          token_id:
            type: string
        additionalProperties: false
    feedback:
      type: object
      description: |
        Token-level diff for `say_it_back`, computed server-side under the
        source lyric language's tokenization / accent / punctuation policy.
      properties:
        matched:
          type: array
          items:
            type: string
        missing:
          type: array
          items:
            type: string
        extra:
          type: array
          items:
            type: string
      additionalProperties: false
    next_review_hint:
      type: string
      enum:
        - again
        - hard
        - good
        - easy
      description: |
        Optional human-facing hint derived from the server FSRS update. FSRS
        scheduling itself is server-internal; the client does not compute it.
    session:
      $ref: "#/components/schemas/SongStudySessionSummary"
    lesson:
      $ref: "#/components/schemas/SongStudyLessonState"
    study_progress:
      type: object
      description: |
        Server-owned Study progress after this attempt. Present when Study
        streak writes are enabled. This lets clients render completion/streak
        state without deriving streak qualification locally.
      properties:
        study_attempt_count:
          type: integer
        study_correct_count:
          type: integer
        study_target_count:
          type: integer
        qualified_today:
          type: boolean
        current_streak:
          type: integer
          description: |
            The projected streak count after today's qualification is
            materialized. Zero when the learner has no active streak.
        next_due_at:
          type: integer
          description: Unix timestamp for the next due Study review, when known.
      required:
        - study_attempt_count
        - study_correct_count
        - study_target_count
        - qualified_today
        - current_streak
      additionalProperties: false
  additionalProperties: false

SongStudyRenderSafeExercise:
  description: |
    Complete next-prompt projection safe to render before grading. It never
    contains `correct_option_id` or `explanation_text`.
  allOf:
    - $ref: "#/components/schemas/SongStudyExercise"

SongStudyLessonNext:
  type: object
  required:
    - exercise_id
    - type
    - is_reappearance
    - presentation_number
    - attempts_this_appearance
    - retry_in_place
    - prompt
  properties:
    exercise_id:
      type: string
    type:
      type: string
      enum: [say_it_back, translation_choice, fill_blank]
    is_reappearance:
      type: boolean
    presentation_number:
      type: integer
      minimum: 1
      description: Next 1-based graded presentation number for this exercise.
    attempts_this_appearance:
      type: integer
      minimum: 0
      description: Graded submissions in the current uninterrupted appearance.
    retry_in_place:
      type: boolean
    prompt:
      $ref: "#/components/schemas/SongStudyRenderSafeExercise"
  additionalProperties: false

SongStudyLessonState:
  type: object
  description: Server-authoritative lesson orchestration projection.
  required:
    - session_revision
    - resolved_count
    - total_count
    - completion_reason
    - serving_index
    - next
  properties:
    session_revision:
      type: integer
      minimum: 0
    resolved_count:
      type: integer
      minimum: 0
    total_count:
      type: integer
      minimum: 0
    completion_reason:
      type: string
      nullable: true
      enum: [all_resolved, presentation_budget]
    serving_index:
      type: integer
      minimum: 1
      description: |
        Monotonic session presentation index. It may exceed total_count but is
        bounded by the session presentation budget; it is not progress.
    next:
      nullable: true
      allOf:
        - $ref: "#/components/schemas/SongStudyLessonNext"
  additionalProperties: false

SongStudyRevisionConflict:
  type: object
  description: |
    Typed stale-client response. Idempotency lookup precedes this check, so an
    existing key always replays its original snapshot instead of conflicting.
  required:
    - code
    - message
    - retryable
    - details
  properties:
    code:
      type: string
      enum: [study_session_revision_conflict]
    message:
      type: string
    retryable:
      type: boolean
      enum: [false]
    details:
      type: object
      required:
        - lesson
      properties:
        lesson:
          $ref: "#/components/schemas/SongStudyLessonState"
      additionalProperties: false
  additionalProperties: false

SongStudyTranscriptionResponse:
  type: object
  description: |
    Final transcript for one say-it-back recording. Raw audio is not stored by
    Pirate. The transcript is not itself a grade; clients submit it to
    `POST .../study/attempts` for server-authoritative grading and FSRS update.
  required:
    - object
    - provider
    - model
    - text
  properties:
    object:
      type: string
      enum:
        - song_study_transcription
    provider:
      type: string
      enum:
        - elevenlabs
    model:
      type: string
    text:
      type: string
    confidence:
      type: number
      nullable: true
    language_code:
      type: string
      nullable: true
    language_probability:
      type: number
      nullable: true
    duration_seconds:
      type: number
      nullable: true
  additionalProperties: false

TelegramStudyVoiceIntentRequest:
  type: object
  required:
    - exercise_id
  properties:
    exercise_id:
      type: string
      minLength: 1
    target_language:
      type: string
      nullable: true
  additionalProperties: false

TelegramStudyVoiceIntent:
  type: object
  required:
    - created
    - expires_at
    - id
    - object
    - status
  properties:
    created:
      type: integer
      format: int64
    expires_at:
      type: integer
      format: int64
    id:
      type: string
    object:
      type: string
      enum:
        - telegram_study_voice_intent
    status:
      type: string
      enum:
        - pending
  additionalProperties: false

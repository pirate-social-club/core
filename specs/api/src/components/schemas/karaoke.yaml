SongKaraokeLine:
  type: object
  required:
    - id
    - index
    - kind
    - text
    - start_ms
    - end_ms
    - words
  properties:
    id:
      type: string
    index:
      type: integer
    kind:
      type: string
      enum:
        - lyric
        - section
    text:
      type: string
    start_ms:
      type: integer
    end_ms:
      type: integer
    words:
      type: array
      items:
        type: object
        required:
          - text
          - start_ms
          - end_ms
        properties:
          text:
            type: string
          start_ms:
            type: integer
          end_ms:
            type: integer
          confidence:
            type: number
            nullable: true
SongKaraokePayload:
  type: object
  required:
    - id
    - object
  properties:
    id:
      type: string
    object:
      type: string
      readOnly: true
      enum:
        - song_karaoke_payload
    song:
      type: string
      nullable: true
    post:
      type: string
      nullable: true
    community:
      type: string
      nullable: true
    title:
      type: string
      nullable: true
    artist_name:
      type: string
      nullable: true
    artwork_src:
      type: string
      nullable: true
    instrumental_audio_url:
      type: string
      nullable: true
    karaoke_lines:
      type: array
      nullable: true
      items:
        $ref: ./karaoke.yaml#/SongKaraokeLine
    raw_lines:
      type: array
      nullable: true
      items:
        type: object
        additionalProperties: true
KaraokeScoringPolicy:
  oneOf:
    - type: object
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - disabled
    - type: object
      required:
        - kind
        - provider
        - model
        - retention
      properties:
        kind:
          type: string
          enum:
            - enabled
        provider:
          type: string
          enum:
            - assistant
            - elevenlabs
            - mistral
            - openai
        model:
          type: string
        retention:
          type: string
          enum:
            - not_stored
        voice_coach_enabled:
          type: boolean
KaraokeSession:
  type: object
  required:
    - id
    - object
    - attempt
    - protocol_version
    - websocket_url
    - token_expires_at
    - session_expires_at
    - scoring_policy
  properties:
    id:
      type: string
    object:
      type: string
      readOnly: true
      enum:
        - karaoke_session
    attempt:
      type: string
    protocol_version:
      type: integer
      enum:
        - 1
    websocket_url:
      type: string
    token_expires_at:
      type: integer
    session_expires_at:
      type: integer
    scoring_policy:
      $ref: ./karaoke.yaml#/KaraokeScoringPolicy

KaraokeRankingScope:
  type: string
  enum:
    - all_time
    - weekly

KaraokeAttemptCompletionReason:
  type: string
  enum:
    - completed
    - session_error
    - provider_unavailable
    - abandoned

KaraokeTimingTrend:
  type: string
  enum:
    - early
    - late
    - mixed
    - on_time

KaraokeAttempt:
  type: object
  required:
    - id
    - object
    - session_id
    - attempt_id
    - post_id
    - community_id
    - karaoke_revision_id
    - scoring_version
    - scoring_provider
    - scoring_model
    - final_score
    - lyrics_score
    - timing_score
    - timing_trend
    - scored_line_count
    - line_count
    - uncertain_line_count
    - no_recognition_line_count
    - low_confidence_line_count
    - completion_reason
    - rank_eligible
    - activity_date
    - completed_at
  properties:
    id:
      type: string
    object:
      type: string
      enum:
        - karaoke_attempt
    session_id:
      type: string
    attempt_id:
      type: string
    post_id:
      type: string
    community_id:
      type: string
    karaoke_revision_id:
      type: string
      description: Song-side revision derived from scoring-relevant karaoke artifacts.
    scoring_version:
      type: integer
      description: Runtime scoring algorithm version.
    scoring_provider:
      type: string
      description: STT/scoring provider captured from the resolved scoring policy.
    scoring_model:
      type: string
      description: STT/scoring model captured from the resolved scoring policy.
    final_score:
      type: integer
      minimum: 0
      maximum: 10000
      description: Final score in basis points.
    lyrics_score:
      type: integer
      minimum: 0
      maximum: 10000
      description: Lyric recognition score in basis points.
    timing_score:
      type: integer
      nullable: true
      minimum: 0
      maximum: 10000
      description: Timing score in basis points, null when timing cannot be measured.
    timing_trend:
      $ref: ./karaoke.yaml#/KaraokeTimingTrend
    scored_line_count:
      type: integer
    line_count:
      type: integer
    uncertain_line_count:
      type: integer
    no_recognition_line_count:
      type: integer
    low_confidence_line_count:
      type: integer
    completion_reason:
      $ref: ./karaoke.yaml#/KaraokeAttemptCompletionReason
    rank_eligible:
      type: boolean
    activity_date:
      type: string
      description: UTC date (`YYYY-MM-DD`) credited for streak progress.
    completed_at:
      type: string
      format: date-time
  additionalProperties: false

KaraokeLeaderboardIdentity:
  type: object
  required:
    - visibility
    - display_name
    - handle
    - avatar_ref
  properties:
    visibility:
      type: string
      enum:
        - visible
        - anonymized
    display_name:
      type: string
      nullable: true
    handle:
      type: string
      nullable: true
      description: Full routing handle label when visible, for example `maya.pirate` or `diego.eth`.
    avatar_ref:
      type: string
      nullable: true
  additionalProperties: false

KaraokeLeaderboardEntry:
  type: object
  required:
    - rank
    - top_percent
    - score
    - reached_at
    - identity
    - is_viewer
  properties:
    rank:
      type: integer
      description: Competition rank (`1, 2, 2, 4`).
    top_percent:
      type: integer
      minimum: 0
      maximum: 100
    score:
      type: integer
      minimum: 0
      maximum: 10000
      description: Best eligible score in basis points.
    reached_at:
      type: string
      format: date-time
      description: Earliest completion time at which this user reached the best score.
    identity:
      $ref: ./karaoke.yaml#/KaraokeLeaderboardIdentity
    is_viewer:
      type: boolean
  additionalProperties: false

KaraokeSongLeaderboard:
  type: object
  required:
    - object
    - post_id
    - community_id
    - scope
    - karaoke_revision_id
    - scoring_version
    - scoring_provider
    - scoring_model
    - total_ranked
    - entries
    - viewer_rank
    - viewer_top_percent
    - viewer_best_score
    - viewer_best_reached_at
    - viewer_eligible_attempt_count
  properties:
    object:
      type: string
      enum:
        - karaoke_song_leaderboard
    post_id:
      type: string
    community_id:
      type: string
    scope:
      $ref: ./karaoke.yaml#/KaraokeRankingScope
    period_start:
      type: string
      nullable: true
      format: date-time
    period_end:
      type: string
      nullable: true
      format: date-time
    karaoke_revision_id:
      type: string
    scoring_version:
      type: integer
    scoring_provider:
      type: string
    scoring_model:
      type: string
    total_ranked:
      type: integer
    entries:
      type: array
      items:
        $ref: ./karaoke.yaml#/KaraokeLeaderboardEntry
    viewer_rank:
      type: integer
      nullable: true
      description: Viewer's competition rank under the active tuple, null when unranked.
    viewer_top_percent:
      type: integer
      nullable: true
      minimum: 0
      maximum: 100
    viewer_best_score:
      type: integer
      nullable: true
      minimum: 0
      maximum: 10000
      description: Viewer's best eligible score in basis points under the active tuple.
    viewer_best_reached_at:
      type: string
      nullable: true
      format: date-time
    viewer_eligible_attempt_count:
      type: integer
  additionalProperties: false

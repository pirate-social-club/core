RewardVerificationState:
  type: string
  enum:
    - unverified
    - verified
    - conflict
RewardEventKind:
  type: string
  enum:
    - study_streak_day
    - study_streak_milestone_7
    - study_streak_milestone_30
    - campaign_practice_day
    - campaign_milestone_7
    - campaign_milestone_30
RewardEventSummary:
  type: object
  required:
    - id
    - user_id
    - community_id
    - post_id
    - activity_date
    - reward_kind
    - amount_cents
    - created_at
  properties:
    id:
      type: string
    user_id:
      type: string
    community_id:
      type: string
    post_id:
      type: string
    activity_date:
      type: string
    reward_kind:
      $ref: ./rewards.yaml#/RewardEventKind
    amount_cents:
      type: integer
    reward_campaign_id:
      type: string
      nullable: true
    reward_period_key:
      type: string
      nullable: true
    qualification_basis:
      type: string
      enum:
        - study
        - karaoke
        - both
      nullable: true
    created_at:
      type: integer
      format: int64
RewardsCashoutSummary:
  type: object
  required:
    - eligible
    - min_cents
    - verification_state
  properties:
    eligible:
      type: boolean
    min_cents:
      type: integer
    verification_state:
      $ref: ./rewards.yaml#/RewardVerificationState
RewardsSummaryResponse:
  type: object
  required:
    - balance_cents
    - today_earned_cents
    - recent_events
    - cashout
    - latest_in_flight_cashout
  properties:
    balance_cents:
      type: integer
    today_earned_cents:
      type: integer
    recent_events:
      type: array
      items:
        $ref: ./rewards.yaml#/RewardEventSummary
    cashout:
      $ref: ./rewards.yaml#/RewardsCashoutSummary
    latest_in_flight_cashout:
      nullable: true
      $ref: ./rewards.yaml#/RewardPayoutSummary
RewardPayoutStatus:
  type: string
  enum:
    - submitted
    - confirmed
    - failed
RewardPayoutSummary:
  type: object
  required:
    - id
    - amount_cents
    - recipient_address
    - status
    - settlement_ref
    - failure_reason
  properties:
    id:
      type: string
    amount_cents:
      type: integer
    recipient_address:
      type: string
    status:
      $ref: ./rewards.yaml#/RewardPayoutStatus
    settlement_ref:
      type: string
      nullable: true
    failure_reason:
      type: string
      nullable: true
RewardCashoutWalletProof:
  type: object
  required:
    - type
    - privy_access_token
  properties:
    type:
      type: string
      enum:
        - privy_access_token
    privy_access_token:
      type: string
    wallet_address:
      type: string
      nullable: true
RewardCashoutRequest:
  type: object
  required:
    - amount_cents
    - idempotency_key
  properties:
    amount_cents:
      type: integer
    idempotency_key:
      type: string
    wallet_proof:
      nullable: true
      $ref: ./rewards.yaml#/RewardCashoutWalletProof
RewardCashoutResponse:
  type: object
  required:
    - payout
    - balance_cents
  properties:
    payout:
      $ref: ./rewards.yaml#/RewardPayoutSummary
    balance_cents:
      type: integer
RewardCampaignStatus:
  type: string
  enum:
    - draft
    - funding_quoted
    - funding_confirming
    - scheduled
    - active
    - paused
    - exhausted
    - ended
    - canceled
RewardCampaignEligibleActivity:
  type: string
  enum:
    - study
    - karaoke
    - either
PublicRewardOffer:
  type: object
  additionalProperties: false
  required:
    - eligible_activity
    - daily_reward_cents
    - ends_at
  properties:
    eligible_activity:
      $ref: ./rewards.yaml#/RewardCampaignEligibleActivity
    daily_reward_cents:
      type: integer
      minimum: 1
    ends_at:
      type: integer
      format: int64
RewardSongOwnerPolicy:
  type: object
  required:
    - community
    - post
    - song_owner
    - third_party_rewards
  properties:
    community:
      type: string
    post:
      type: string
    song_owner:
      type: string
    third_party_rewards:
      type: string
      enum:
        - allowed
        - blocked
RewardSongOwnerPolicyUpdateRequest:
  type: object
  required:
    - third_party_rewards
  properties:
    third_party_rewards:
      type: string
      enum:
        - allowed
        - blocked
RewardCampaign:
  type: object
  required:
    - id
    - object
    - rewarder
    - community
    - post
    - song_artifact_bundle
    - song_owner
    - status
    - eligible_activity
    - daily_reward_cents
    - milestone_7_cents
    - milestone_30_cents
    - reward_period_cap_cents
    - budget_cents
    - funded_cents
    - reserved_cents
    - credited_cents
    - paid_cents
    - refunded_cents
    - remaining_cents
    - starts_at
    - ends_at
    - created
  properties:
    id:
      type: string
    object:
      type: string
      enum:
        - reward_campaign
    rewarder:
      type: string
    community:
      type: string
    post:
      type: string
    song_artifact_bundle:
      type: string
    song_owner:
      type: string
    status:
      $ref: ./rewards.yaml#/RewardCampaignStatus
    eligible_activity:
      $ref: ./rewards.yaml#/RewardCampaignEligibleActivity
    daily_reward_cents:
      type: integer
      minimum: 1
    milestone_7_cents:
      type: integer
      minimum: 0
    milestone_30_cents:
      type: integer
      minimum: 0
    reward_period_cap_cents:
      type: integer
      minimum: 1
    budget_cents:
      type: integer
      minimum: 1
    funded_cents:
      type: integer
      minimum: 0
    reserved_cents:
      type: integer
      minimum: 0
    credited_cents:
      type: integer
      minimum: 0
    paid_cents:
      type: integer
      minimum: 0
    refunded_cents:
      type: integer
      minimum: 0
    remaining_cents:
      type: integer
      minimum: 0
    starts_at:
      type: integer
      format: int64
    ends_at:
      type: integer
      format: int64
    activated_at:
      type: integer
      format: int64
      nullable: true
    exhausted_at:
      type: integer
      format: int64
      nullable: true
    ended_at:
      type: integer
      format: int64
      nullable: true
    canceled_at:
      type: integer
      format: int64
      nullable: true
    created:
      type: integer
      format: int64
RewardCampaignCreateRequest:
  type: object
  required:
    - community
    - post
    - eligible_activity
    - daily_reward_cents
    - milestone_7_cents
    - milestone_30_cents
    - reward_period_cap_cents
    - budget_cents
    - starts_at
    - ends_at
    - idempotency_key
  properties:
    community:
      type: string
    post:
      type: string
    eligible_activity:
      $ref: ./rewards.yaml#/RewardCampaignEligibleActivity
    daily_reward_cents:
      type: integer
      minimum: 1
    milestone_7_cents:
      type: integer
      minimum: 0
      maximum: 0
      description: Must remain zero until campaign milestone crediting is implemented.
    milestone_30_cents:
      type: integer
      minimum: 0
      maximum: 0
      description: Must remain zero until campaign milestone crediting is implemented.
    reward_period_cap_cents:
      type: integer
      minimum: 1
    budget_cents:
      type: integer
      minimum: 1
    starts_at:
      type: integer
      format: int64
    ends_at:
      type: integer
      format: int64
    idempotency_key:
      type: string
RewardCampaignFundingStatus:
  type: string
  enum:
    - quoted
    - confirming
    - confirmed
    - failed
    - refunded
RewardCampaignFundingQuote:
  type: object
  required:
    - id
    - object
    - campaign
    - funder
    - chain_id
    - token_address
    - amount_cents
    - amount_atomic
    - sender_address
    - treasury_address
    - status
    - expires_at
    - created
  properties:
    id:
      type: string
    object:
      type: string
      enum:
        - reward_campaign_funding_quote
    campaign:
      type: string
    funder:
      type: string
    chain_id:
      type: integer
    token_address:
      type: string
    amount_cents:
      type: integer
      minimum: 1
    amount_atomic:
      type: string
    sender_address:
      type: string
    treasury_address:
      type: string
    tx_hash:
      type: string
      nullable: true
    status:
      $ref: ./rewards.yaml#/RewardCampaignFundingStatus
    failure_reason:
      type: string
      nullable: true
    expires_at:
      type: integer
      format: int64
    confirmed_at:
      type: integer
      format: int64
      nullable: true
    created:
      type: integer
      format: int64
RewardCampaignFundingQuoteRequest:
  type: object
  required:
    - amount_cents
    - idempotency_key
  properties:
    amount_cents:
      type: integer
      minimum: 1
    idempotency_key:
      type: string
RewardCampaignFundingConfirmRequest:
  type: object
  required:
    - tx_hash
  properties:
    tx_hash:
      type: string

LearningDeckCreateRequest:
  type: object
  additionalProperties: false
  required: [title]
  properties:
    title:
      type: string
      minLength: 1
    description:
      type: string
      nullable: true
LearningDeckCardRequest:
  type: object
  additionalProperties: false
  required: [card_type, prompt, answer]
  properties:
    card_id:
      type: string
      nullable: true
    card_type:
      type: string
      enum: [basic, cloze]
    prompt:
      type: string
    answer:
      type: string
    tags:
      type: array
      items:
        type: string
    ordinal:
      type: integer
      minimum: 0
      nullable: true
LearningDeckCard:
  type: object
  additionalProperties: false
  required: [cardId, cardType, prompt, answer, tags, ordinal, retiredAt]
  properties:
    cardId:
      type: string
    cardType:
      type: string
      enum: [basic, cloze]
    prompt:
      type: string
    answer:
      type: string
    tags:
      type: array
      items:
        type: string
    ordinal:
      type: integer
    retiredAt:
      type: string
      nullable: true
    contentHash:
      type: string
      nullable: true
LearningDeckDraft:
  type: object
  additionalProperties: false
  required: [deck, version, cards]
  properties:
    deck:
      type: object
      additionalProperties: true
      required: [learning_deck_id, title, description, status]
      properties:
        learning_deck_id:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [draft, published, archived]
    version:
      type: object
      additionalProperties: true
      required: [learning_deck_version_id, version, status]
      properties:
        learning_deck_version_id:
          type: string
        version:
          type: integer
        status:
          type: string
    cards:
      type: array
      items:
        $ref: ./learning-decks.yaml#/LearningDeckCard
LearningDeckValidation:
  type: object
  additionalProperties: false
  required: [draft, issues, canonical]
  properties:
    draft:
      $ref: ./learning-decks.yaml#/LearningDeckDraft
    issues:
      type: array
      items:
        type: object
        additionalProperties: true
        required: [message]
        properties:
          message:
            type: string
    canonical:
      type: object
      nullable: true
      additionalProperties: true
      required: [schema_version, card_count, content_hash, json]
      properties:
        schema_version:
          type: integer
        card_count:
          type: integer
        content_hash:
          type: string
        json:
          type: string
LearningDeckCsvImportPreview:
  type: object
  additionalProperties: false
  required: [headers, rows, errors, row_count, error_count]
  properties:
    headers:
      type: array
      items:
        type: string
    rows:
      type: array
      items:
        type: array
        items:
          type: string
    errors:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [row, code, message]
        properties:
          row:
            type: integer
          code:
            type: string
          message:
            type: string
    row_count:
      type: integer
    error_count:
      type: integer
LearningDeckCsvImportStatus:
  type: object
  additionalProperties: false
  required: [import_job_id, status, preview, error]
  properties:
    import_job_id:
      type: string
    status:
      type: string
      enum: [queued, running, succeeded, failed]
    preview:
      allOf:
        - $ref: ./learning-decks.yaml#/LearningDeckCsvImportPreview
      nullable: true
    error:
      type: string
      nullable: true
LearningDeckCsvImportPreviewRequest:
  type: object
  additionalProperties: false
  required: [content_blob_id]
  properties:
    content_blob_id:
      type: string
LearningDeckCsvImportCommitRequest:
  type: object
  additionalProperties: false
  required: [content_blob_id, import_job_id, prompt_column, answer_column]
  properties:
    content_blob_id:
      type: string
    import_job_id:
      type: string
    prompt_column:
      type: integer
      minimum: 0
    answer_column:
      type: integer
      minimum: 0
    tags_column:
      type: integer
      minimum: 0
      nullable: true
LearningDeckStudySessionRequest:
  type: object
  additionalProperties: false
  properties:
    now_ms:
      type: integer
      format: int64
    limit:
      type: integer
      minimum: 1
LearningDeckRevealRequest:
  type: object
  additionalProperties: false
  required: [expected_session_revision]
  properties:
    expected_session_revision:
      type: integer
      minimum: 0
LearningDeckRateRequest:
  type: object
  additionalProperties: false
  required: [item_id, rating, idempotency_key, expected_session_revision]
  properties:
    item_id:
      type: string
    rating:
      type: string
      enum: [again, hard, good, easy]
    idempotency_key:
      type: string
    expected_session_revision:
      type: integer
      minimum: 0
    reviewed_at_ms:
      type: integer
      format: int64
LearningDeckStudySession:
  type: object
  additionalProperties: true

SongStreakLeaderboardIdentity:
  type: object
  required:
    - user_id
  properties:
    user_id:
      type: string
    handle:
      type: string
      nullable: true
    display_name:
      type: string
      nullable: true
    avatar_ref:
      type: string
      nullable: true
  additionalProperties: false

SongStreakLeaderboardEntry:
  type: object
  required:
    - rank
    - identity
    - current_streak
    - best_streak
    - total_qualified_days
    - streak_started_date
    - last_qualified_date
    - active_until_at
    - is_viewer
  properties:
    rank:
      type: integer
    identity:
      $ref: ./song-streaks.yaml#/SongStreakLeaderboardIdentity
    current_streak:
      type: integer
    best_streak:
      type: integer
    total_qualified_days:
      type: integer
    streak_started_date:
      type: string
      description: Date (`YYYY-MM-DD`) that started the current run, in the owner's pinned timezone.
    last_qualified_date:
      type: string
      description: Last date (`YYYY-MM-DD`) that qualified this streak, in the owner's pinned timezone.
    active_until_at:
      type: string
      description: |
        UTC instant (ISO-8601) when this streak stops being active without a
        new qualification — the end of the grace day in the owner's pinned
        timezone. Entries are only returned while active.
    is_viewer:
      type: boolean
  additionalProperties: false

SongStreakViewerStanding:
  type: object
  required:
    - alive
    - current_streak
    - best_streak
    - total_qualified_days
    - qualified_today
    - study_attempts_today
    - study_target_today
    - karaoke_passed_today
  properties:
    alive:
      type: boolean
      description: Whether the streak is still active (qualified today or yesterday in the viewer's pinned timezone).
    current_streak:
      type: integer
      description: >
        Current run length; 0 when the streak has lapsed (`alive: false`).
    best_streak:
      type: integer
      description: Historical maximum run length.
    total_qualified_days:
      type: integer
    qualified_today:
      type: boolean
    study_attempts_today:
      type: integer
    study_target_today:
      type: integer
    karaoke_passed_today:
      type: boolean
    rank:
      type: integer
      nullable: true
      description: Competition rank among active streaks; null when lapsed or unranked.
    active_until_at:
      type: string
      nullable: true
      description: UTC instant (ISO-8601) when the viewer's streak stops being active without a new qualification.
  additionalProperties: false

SongStreakLeaderboard:
  type: object
  required:
    - object
    - post_id
    - community_id
    - date
    - entries
    - viewer
    - total_active_streaks
  properties:
    object:
      type: string
      enum:
        - song_streak_leaderboard
    post_id:
      type: string
    community_id:
      type: string
    date:
      type: string
      description: UTC date (`YYYY-MM-DD`) of this read.
    entries:
      type: array
      items:
        $ref: ./song-streaks.yaml#/SongStreakLeaderboardEntry
    viewer:
      nullable: true
      oneOf:
        - $ref: ./song-streaks.yaml#/SongStreakViewerStanding
    total_active_streaks:
      type: integer
  additionalProperties: false

SongStreakSummary:
  type: object
  description: Lightweight per-post streak preview for feed and post cards.
  required:
    - entries
    - viewer
    - total_active_streaks
  properties:
    entries:
      type: array
      maxItems: 3
      items:
        $ref: ./song-streaks.yaml#/SongStreakLeaderboardEntry
    viewer:
      nullable: true
      oneOf:
        - $ref: ./song-streaks.yaml#/SongStreakViewerStanding
    total_active_streaks:
      type: integer
  additionalProperties: false

BookingStatus:
  type: string
  enum:
    - confirmed
    - live
    - completed
    - settled
    - cancelled_by_host
    - cancelled_by_booker
    - no_show_host
    - no_show_booker
    - refunded
    - disputed
BookingViewerRole:
  type: string
  enum:
    - host
    - booker
BookingView:
  type: object
  required:
    - object
    - booking_id
    - host_user_id
    - booker_user_id
    - slot_start_utc
    - slot_end_utc
    - gross_cents
    - platform_fee_cents
    - host_payout_cents
    - refund_cents
    - status
    - funding_tx_ref
    - payout_tx_ref
    - refund_tx_ref
    - live_room_id
    - source_community_id
    - confirmed_at
    - completed_at
    - settled_at
    - cancelled_at
    - created_at
    - updated_at
    - viewer_role
  properties:
    object:
      type: string
      enum:
        - booking
    booking_id:
      type: string
    host_user_id:
      type: string
    booker_user_id:
      type: string
    slot_start_utc:
      type: string
      format: date-time
    slot_end_utc:
      type: string
      format: date-time
    gross_cents:
      type: integer
      minimum: 0
    platform_fee_cents:
      type: integer
      minimum: 0
    host_payout_cents:
      type: integer
      minimum: 0
    refund_cents:
      type: integer
      minimum: 0
      nullable: true
    status:
      $ref: ./bookings.yaml#/BookingStatus
    funding_tx_ref:
      type: string
      nullable: true
    payout_tx_ref:
      type: string
      nullable: true
    refund_tx_ref:
      type: string
      nullable: true
    live_room_id:
      type: string
      nullable: true
    source_community_id:
      type: string
      nullable: true
    confirmed_at:
      type: string
      format: date-time
      nullable: true
    completed_at:
      type: string
      format: date-time
      nullable: true
    settled_at:
      type: string
      format: date-time
      nullable: true
    cancelled_at:
      type: string
      format: date-time
      nullable: true
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
    viewer_role:
      $ref: ./bookings.yaml#/BookingViewerRole
BookingListResponse:
  type: object
  required:
    - object
    - data
    - has_more
  properties:
    object:
      type: string
      enum:
        - list
    data:
      type: array
      items:
        $ref: ./bookings.yaml#/BookingView
    has_more:
      type: boolean
BookingDetailResponse:
  type: object
  required:
    - booking
  properties:
    booking:
      $ref: ./bookings.yaml#/BookingView
BookingSlot:
  type: object
  required:
    - startUtc
    - endUtc
    - priceCents
    - available
  properties:
    startUtc:
      type: string
      format: date-time
    endUtc:
      type: string
      format: date-time
    priceCents:
      type: integer
      minimum: 0
    available:
      type: boolean
BookingSlotsResponse:
  type: object
  required:
    - host_timezone
    - viewer_timezone
    - slots
  properties:
    host_timezone:
      type: string
    viewer_timezone:
      type: string
    slots:
      type: array
      items:
        $ref: ./bookings.yaml#/BookingSlot
CreateBookingHoldRequest:
  type: object
  required:
    - slot_start_utc
    - slot_end_utc
  properties:
    slot_start_utc:
      type: string
      format: date-time
    slot_end_utc:
      type: string
      format: date-time
    source_community_id:
      type: string
      nullable: true
BookingHold:
  type: object
  required:
    - hold_id
    - host_user_id
    - booker_user_id
    - slot_start_utc
    - slot_end_utc
    - price_cents
    - status
    - expires_at_utc
  properties:
    hold_id:
      type: string
    host_user_id:
      type: string
    booker_user_id:
      type: string
    source_community_id:
      type: string
      nullable: true
    slot_start_utc:
      type: string
      format: date-time
    slot_end_utc:
      type: string
      format: date-time
    price_cents:
      type: integer
      minimum: 0
    status:
      type: string
      enum:
        - active
        - quoted
        - confirmed
        - expired
        - released
    expires_at_utc:
      type: string
      format: date-time
BookingHoldResponse:
  type: object
  required:
    - hold
  properties:
    hold:
      $ref: ./bookings.yaml#/BookingHold
BookingPaymentInstructions:
  type: object
  required:
    - payment_intent_id
    - version
    - chain_id
    - token_address
    - token_decimals
    - token_symbol
    - recipient_address
    - amount_atomic
    - gross_cents
    - quote_expires_at
    - hold_expires_at
    - wallet_attachment_required
  properties:
    payment_intent_id:
      type: string
    version:
      type: integer
      minimum: 1
    chain_id:
      type: integer
    token_address:
      type: string
    token_decimals:
      type: integer
    token_symbol:
      type: string
    recipient_address:
      type: string
    amount_atomic:
      type: string
    gross_cents:
      type: integer
      minimum: 0
    quote_expires_at:
      type: string
      format: date-time
    hold_expires_at:
      type: string
      format: date-time
    wallet_attachment_required:
      type: boolean
BookingQuote:
  type: object
  required:
    - hold_id
    - gross_cents
    - platform_fee_bps
    - platform_fee_cents
    - host_payout_cents
    - expires_at_utc
    - payment
  properties:
    hold_id:
      type: string
    gross_cents:
      type: integer
      minimum: 0
    platform_fee_bps:
      type: integer
      minimum: 0
      maximum: 10000
    platform_fee_cents:
      type: integer
      minimum: 0
    host_payout_cents:
      type: integer
      minimum: 0
    expires_at_utc:
      type: string
      format: date-time
    payment:
      $ref: ./bookings.yaml#/BookingPaymentInstructions
BookingQuoteResponse:
  type: object
  required:
    - quote
  properties:
    quote:
      $ref: ./bookings.yaml#/BookingQuote
ConfirmBookingHoldRequest:
  type: object
  required:
    - funding_tx_ref
    - wallet_attachment_id
  properties:
    funding_tx_ref:
      type: string
    wallet_attachment_id:
      type: string
BookingSnapshot:
  type: object
  required:
    - booking_id
    - hold_id
    - host_user_id
    - booker_user_id
    - slot_start_utc
    - slot_end_utc
    - gross_cents
    - platform_fee_cents
    - host_payout_cents
    - status
    - funding_tx_ref
  properties:
    booking_id:
      type: string
    hold_id:
      type: string
    host_user_id:
      type: string
    booker_user_id:
      type: string
    slot_start_utc:
      type: string
      format: date-time
    slot_end_utc:
      type: string
      format: date-time
    gross_cents:
      type: integer
      minimum: 0
    platform_fee_cents:
      type: integer
      minimum: 0
    host_payout_cents:
      type: integer
      minimum: 0
    status:
      $ref: ./bookings.yaml#/BookingStatus
    funding_tx_ref:
      type: string
      nullable: true
BookingConfirmResponse:
  type: object
  required:
    - booking
    - already_confirmed
  properties:
    booking:
      $ref: ./bookings.yaml#/BookingSnapshot
    already_confirmed:
      type: boolean
BookingLifecycleSnapshot:
  type: object
  required:
    - booking_id
    - status
    - refund_cents
    - refund_tx_ref
    - payout_tx_ref
  properties:
    booking_id:
      type: string
    status:
      $ref: ./bookings.yaml#/BookingStatus
    refund_cents:
      type: integer
      minimum: 0
    refund_tx_ref:
      type: string
      nullable: true
    payout_tx_ref:
      type: string
      nullable: true
BookingLifecycleResponse:
  type: object
  required:
    - booking
  properties:
    booking:
      $ref: ./bookings.yaml#/BookingLifecycleSnapshot
    already_cancelled:
      type: boolean
    already_live:
      type: boolean
    already_settled:
      type: boolean
    already_resolved:
      type: boolean
    cancelled_by:
      type: string
      enum:
        - host
        - booker
BookingAgoraBlock:
  type: object
  required:
    - app_id
    - channel
    - uid
    - token
    - token_expires_at
    - configured
  properties:
    app_id:
      type: string
      nullable: true
    channel:
      type: string
    uid:
      type: integer
    token:
      type: string
      nullable: true
    token_expires_at:
      type: integer
      nullable: true
    configured:
      type: boolean
AttachBookingSessionResponse:
  type: object
  required:
    - session_id
    - party
    - channel
    - agora
  properties:
    session_id:
      type: string
    party:
      type: string
      enum:
        - host
        - booker
    channel:
      type: string
    agora:
      $ref: ./bookings.yaml#/BookingAgoraBlock
BookingHeartbeatRequest:
  type: object
  required:
    - session_id
  properties:
    session_id:
      type: string
BookingHeartbeatResponse:
  type: object
  required:
    - ok
  properties:
    ok:
      type: boolean
HostBookingProfile:
  type: object
  required:
    - host_user_id
    - host_timezone
    - base_price_cents
    - default_slot_duration_seconds
    - platform_fee_bps
    - is_published
    - topics
  properties:
    host_user_id:
      type: string
    display_headline:
      type: string
      nullable: true
    bio:
      type: string
      nullable: true
    topics:
      type: array
      items:
        type: string
    intro_video_ref:
      type: string
      nullable: true
    host_timezone:
      type: string
    base_price_cents:
      type: integer
      minimum: 0
    default_slot_duration_seconds:
      type: integer
      minimum: 1
    platform_fee_bps:
      type: integer
      minimum: 0
      maximum: 10000
    payout_wallet_address:
      type: string
      nullable: true
    is_published:
      type: boolean
UpsertHostBookingProfileRequest:
  type: object
  properties:
    host_timezone:
      type: string
    base_price_cents:
      type: integer
      minimum: 0
    default_slot_duration_seconds:
      type: integer
      minimum: 1
    display_headline:
      type: string
      nullable: true
    bio:
      type: string
      nullable: true
    topics:
      type: array
      items:
        type: string
    intro_video_ref:
      type: string
      nullable: true
    platform_fee_bps:
      type: integer
      minimum: 0
      maximum: 10000
    payout_wallet_address:
      type: string
      nullable: true
HostBookingAvailabilityRule:
  type: object
  required:
    - rule_id
    - by_weekday
    - start_local
    - end_local
    - slot_duration_seconds
  properties:
    rule_id:
      type: string
    by_weekday:
      type: array
      items:
        type: integer
        minimum: 0
        maximum: 6
    start_local:
      type: string
      example: "09:00"
    end_local:
      type: string
      example: "17:00"
    slot_duration_seconds:
      type: integer
      minimum: 1
    effective_from_utc:
      type: string
      format: date-time
      nullable: true
    effective_until_utc:
      type: string
      format: date-time
      nullable: true
CreateHostBookingAvailabilityRuleRequest:
  type: object
  required:
    - by_weekday
    - start_local
    - end_local
    - slot_duration_seconds
  properties:
    by_weekday:
      type: array
      items:
        type: integer
        minimum: 0
        maximum: 6
    start_local:
      type: string
    end_local:
      type: string
    slot_duration_seconds:
      type: integer
      minimum: 1
    effective_from_utc:
      type: string
      format: date-time
      nullable: true
    effective_until_utc:
      type: string
      format: date-time
      nullable: true
UpdateHostBookingAvailabilityRuleRequest:
  type: object
  properties:
    by_weekday:
      type: array
      items:
        type: integer
        minimum: 0
        maximum: 6
    start_local:
      type: string
    end_local:
      type: string
    slot_duration_seconds:
      type: integer
      minimum: 1
    effective_from_utc:
      type: string
      format: date-time
      nullable: true
    effective_until_utc:
      type: string
      format: date-time
      nullable: true
HostBookingAvailabilityRuleListResponse:
  type: object
  required:
    - object
    - data
    - has_more
  properties:
    object:
      type: string
      enum:
        - list
    data:
      type: array
      items:
        $ref: ./bookings.yaml#/HostBookingAvailabilityRule
    has_more:
      type: boolean

BookingProfile:
  type: object
  additionalProperties: true
  required:
    - object
    - host
    - host_timezone
    - base_price_cents
    - default_slot_duration_seconds
    - platform_fee_bps
    - is_published
    - created
    - updated
  properties:
    object:
      type: string
      enum: [booking_profile]
    host:
      type: string
    display_headline:
      type: string
      nullable: true
    bio:
      type: string
      nullable: true
    topics:
      type: array
      nullable: true
      items:
        type: string
    intro_video_ref:
      type: string
      nullable: true
    host_timezone:
      type: string
    base_price_cents:
      type: integer
      minimum: 0
    default_slot_duration_seconds:
      type: integer
      minimum: 60
    platform_fee_bps:
      type: integer
      minimum: 0
    payout_wallet_address:
      type: string
      nullable: true
    is_published:
      type: boolean
    created:
      type: integer
    updated:
      type: integer
BookingProfileEmpty:
  type: object
  additionalProperties: false
  required: [object, exists, host]
  properties:
    object:
      type: string
      enum: [booking_profile]
    exists:
      type: boolean
      enum: [false]
    host:
      type: string
BookingProfileResponse:
  oneOf:
    - $ref: "#/BookingProfile"
    - $ref: "#/BookingProfileEmpty"
UpdateBookingProfileRequest:
  type: object
  additionalProperties: false
  properties:
    host_timezone:
      type: string
    base_price_cents:
      type: integer
      minimum: 0
    default_slot_duration_seconds:
      type: integer
      minimum: 60
    display_headline:
      type: string
      nullable: true
    bio:
      type: string
      nullable: true
    topics:
      type: array
      nullable: true
      items:
        type: string
    intro_video_ref:
      type: string
      nullable: true
    platform_fee_bps:
      type: integer
      minimum: 0
    payout_wallet_address:
      type: string
      nullable: true
AvailabilityRule:
  type: object
  additionalProperties: false
  required: [object, id, by_weekday, start_local, end_local, slot_duration_seconds, effective_from, effective_until, created, updated]
  properties:
    object:
      type: string
      enum: [availability_rule]
    id:
      type: string
    by_weekday:
      type: array
      items:
        type: integer
        minimum: 0
        maximum: 6
    start_local:
      type: string
    end_local:
      type: string
    slot_duration_seconds:
      type: integer
      minimum: 60
    effective_from:
      type: integer
      nullable: true
    effective_until:
      type: integer
      nullable: true
    created:
      type: integer
    updated:
      type: integer
CreateAvailabilityRuleRequest:
  type: object
  additionalProperties: false
  required: [by_weekday, start_local, end_local, slot_duration_seconds]
  properties:
    by_weekday:
      type: array
      items:
        type: integer
        minimum: 0
        maximum: 6
    start_local:
      type: string
    end_local:
      type: string
    slot_duration_seconds:
      type: integer
      minimum: 60
    effective_from_utc:
      type: string
      format: date-time
    effective_until_utc:
      type: string
      format: date-time
UpdateAvailabilityRuleRequest:
  type: object
  additionalProperties: false
  properties:
    by_weekday:
      type: array
      items:
        type: integer
        minimum: 0
        maximum: 6
    start_local:
      type: string
    end_local:
      type: string
    slot_duration_seconds:
      type: integer
      minimum: 60
    effective_from_utc:
      type: string
      format: date-time
    effective_until_utc:
      type: string
      format: date-time
AvailabilityException:
  type: object
  additionalProperties: false
  required: [object, id, kind, start, end, created]
  properties:
    object:
      type: string
      enum: [availability_exception]
    id:
      type: string
    kind:
      type: string
      enum: [block, open]
    start:
      type: integer
    end:
      type: integer
    created:
      type: integer
CreateAvailabilityExceptionRequest:
  type: object
  additionalProperties: false
  required: [kind, start_utc, end_utc]
  properties:
    kind:
      type: string
      enum: [block, open]
    start_utc:
      type: string
      format: date-time
    end_utc:
      type: string
      format: date-time
UpdateAvailabilityExceptionRequest:
  type: object
  additionalProperties: false
  properties:
    kind:
      type: string
      enum: [block, open]
    start_utc:
      type: string
      format: date-time
    end_utc:
      type: string
      format: date-time
PriceRule:
  type: object
  additionalProperties: false
  required: [object, id, match_weekday, match_local_start, match_local_end, match_duration_seconds, price_cents, priority, created, updated]
  properties:
    object:
      type: string
      enum: [price_rule]
    id:
      type: string
    match_weekday:
      type: array
      nullable: true
      items:
        type: integer
        minimum: 0
        maximum: 6
    match_local_start:
      type: string
      nullable: true
    match_local_end:
      type: string
      nullable: true
    match_duration_seconds:
      type: integer
      nullable: true
      minimum: 60
    price_cents:
      type: integer
      minimum: 0
    priority:
      type: integer
    created:
      type: integer
    updated:
      type: integer
CreatePriceRuleRequest:
  type: object
  additionalProperties: false
  required: [price_cents]
  properties:
    match_weekday:
      type: array
      nullable: true
      items:
        type: integer
        minimum: 0
        maximum: 6
    match_local_start:
      type: string
      nullable: true
    match_local_end:
      type: string
      nullable: true
    match_duration_seconds:
      type: integer
      nullable: true
      minimum: 60
    price_cents:
      type: integer
      minimum: 0
    priority:
      type: integer
UpdatePriceRuleRequest:
  type: object
  additionalProperties: false
  properties:
    match_weekday:
      type: array
      nullable: true
      items:
        type: integer
        minimum: 0
        maximum: 6
    match_local_start:
      type: string
      nullable: true
    match_local_end:
      type: string
      nullable: true
    match_duration_seconds:
      type: integer
      nullable: true
      minimum: 60
    price_cents:
      type: integer
      minimum: 0
    priority:
      type: integer
ResolvedBookingSlot:
  type: object
  additionalProperties: false
  required: [startUtc, endUtc, priceCents, available]
  properties:
    startUtc:
      type: string
      format: date-time
    endUtc:
      type: string
      format: date-time
    priceCents:
      type: integer
      minimum: 0
    available:
      type: boolean
BookingSlotsResponse:
  type: object
  additionalProperties: false
  required: [host_timezone, viewer_timezone, slots]
  properties:
    host_timezone:
      type: string
    viewer_timezone:
      type: string
    slots:
      type: array
      items:
        $ref: "#/ResolvedBookingSlot"
CreateBookingHoldRequest:
  type: object
  additionalProperties: false
  required: [slot_start_utc, slot_end_utc]
  properties:
    slot_start_utc:
      type: string
      format: date-time
    slot_end_utc:
      type: string
      format: date-time
    source_community_id:
      type: string
      nullable: true
BookingHold:
  type: object
  additionalProperties: true
  properties:
    hold_id:
      type: string
BookingPaymentInstructions:
  type: object
  additionalProperties: true
  required: [payment_intent_id, version, chain_id, token_address, token_decimals, token_symbol, recipient_address, amount_atomic, gross_cents, quote_expires_at, hold_expires_at, wallet_attachment_required]
  properties:
    payment_intent_id:
      type: string
    version:
      type: integer
    chain_id:
      type: integer
    token_address:
      type: string
    token_decimals:
      type: integer
    token_symbol:
      type: string
    recipient_address:
      type: string
    amount_atomic:
      type: string
    gross_cents:
      type: integer
    quote_expires_at:
      type: string
      format: date-time
    hold_expires_at:
      type: string
      format: date-time
    wallet_attachment_required:
      type: boolean
BookingQuote:
  type: object
  additionalProperties: true
  required: [hold_id, gross_cents, platform_fee_bps, platform_fee_cents, host_payout_cents, expires_at_utc, payment]
  properties:
    hold_id:
      type: string
    gross_cents:
      type: integer
    platform_fee_bps:
      type: integer
    platform_fee_cents:
      type: integer
    host_payout_cents:
      type: integer
    expires_at_utc:
      type: string
      format: date-time
    payment:
      $ref: "#/BookingPaymentInstructions"
ConfirmBookingHoldRequest:
  type: object
  additionalProperties: false
  required: [funding_tx_ref, wallet_attachment_id]
  properties:
    funding_tx_ref:
      type: string
    wallet_attachment_id:
      type: string
SubmitBookingPaymentRequest:
  type: object
  additionalProperties: false
  required: [tx_ref, wallet_attachment_id]
  properties:
    tx_ref:
      type: string
    wallet_attachment_id:
      type: string
BookingPaymentResumeState:
  type: string
  enum: [payable, confirmable, finalizable, booked, refund_pending]
BookingCustodyRefund:
  type: object
  additionalProperties: false
  required:
    - observed_amount_atomic
    - sender_address
    - reason
    - detected_at
    - refund_tx_ref
    - refunded_at
  properties:
    observed_amount_atomic:
      type: string
      pattern: "^[1-9][0-9]*$"
    sender_address:
      type: string
    reason:
      type: string
      enum: [wrong_transfer_amount, unexpected_sender]
    detected_at:
      type: string
      format: date-time
    refund_tx_ref:
      type: string
      nullable: true
    refunded_at:
      type: string
      format: date-time
      nullable: true
BookingCustodyIncidentTransfer:
  type: object
  additionalProperties: false
  required: [sender_address, observed_amount_atomic, transfer_count]
  properties:
    sender_address:
      type: string
    observed_amount_atomic:
      type: string
      pattern: "^[1-9][0-9]*$"
    transfer_count:
      type: integer
      minimum: 1
BookingCustodyIncident:
  type: object
  additionalProperties: false
  required: [reason, transfers, detected_at]
  properties:
    reason:
      type: string
      enum: [multiple_senders]
    transfers:
      type: array
      minItems: 2
      items:
        $ref: "#/BookingCustodyIncidentTransfer"
    detected_at:
      type: string
      format: date-time
PendingBookingPaymentIntent:
  type: object
  additionalProperties: false
  required:
    - hold_id
    - payment_intent_id
    - intent_status
    - resume_state
    - claimed_tx_ref
    - wallet_attachment_id
    - payment
    - quote_expires_at
    - hold_expires_at
    - host_user_id
    - slot_start_utc
    - slot_end_utc
    - booking_id
  properties:
    hold_id:
      type: string
    payment_intent_id:
      type: string
    intent_status:
      type: string
      enum: [active, verifying, verified, verification_failed, custody_refund_pending, consumed]
    resume_state:
      $ref: "#/BookingPaymentResumeState"
    claimed_tx_ref:
      type: string
      nullable: true
    wallet_attachment_id:
      type: string
      nullable: true
    payment:
      $ref: "#/BookingPaymentInstructions"
    quote_expires_at:
      type: string
      format: date-time
    hold_expires_at:
      type: string
      format: date-time
    host_user_id:
      type: string
    slot_start_utc:
      type: string
      format: date-time
    slot_end_utc:
      type: string
      format: date-time
    booking_id:
      type: string
      nullable: true
    custody_refund:
      allOf:
        - $ref: "#/BookingCustodyRefund"
      nullable: true
UnresolvedBookingPaymentIntent:
  type: object
  additionalProperties: false
  required:
    - payment_intent_id
    - hold_id
    - host_user_id
    - booker_user_id
    - intent_status
    - hold_status
    - claimed_tx_ref
    - hold_expires_at
    - updated_at
    - unresolved_age_seconds
  properties:
    payment_intent_id:
      type: string
    hold_id:
      type: string
    host_user_id:
      type: string
    booker_user_id:
      type: string
    intent_status:
      type: string
      enum: [verifying, verified, verification_failed, custody_refund_pending, custody_operator_incident]
    hold_status:
      type: string
      enum: [active, consumed, expired]
    claimed_tx_ref:
      type: string
    hold_expires_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
    unresolved_age_seconds:
      type: integer
      minimum: 0
    custody_refund:
      allOf:
        - $ref: "#/BookingCustodyRefund"
      nullable: true
    custody_incident:
      allOf:
        - $ref: "#/BookingCustodyIncident"
      nullable: true
BookingStatus:
  type: string
  enum: [hold, quoted, pending_payment, confirmed, live, completed, settled, expired_hold, cancelled_before_payment, cancelled_by_host, cancelled_by_booker, no_show_host, no_show_booker, refunded, disputed]
BookingOutcome:
  type: string
  nullable: true
  enum: [completed, no_show_host, no_show_booker, cancelled_by_host, cancelled_by_booker]
BookingSettlementStatus:
  type: string
  enum: [pending, live, settling, settled, refunded, disputed]
BookingCounterparty:
  type: object
  additionalProperties: false
  required: [user_id, public_handle, display_name, avatar_ref]
  properties:
    user_id:
      type: string
    public_handle:
      type: string
      nullable: true
    display_name:
      type: string
      nullable: true
    avatar_ref:
      type: string
      nullable: true
Booking:
  type: object
  additionalProperties: true
  required: [booking_id, host_user_id, booker_user_id, slot_start_utc, slot_end_utc, gross_cents, platform_fee_cents, host_payout_cents, status]
  properties:
    booking_id:
      type: string
    status:
      $ref: "#/BookingStatus"
    outcome:
      $ref: "#/BookingOutcome"
    settlement_status:
      $ref: "#/BookingSettlementStatus"
    counterparty:
      $ref: "#/BookingCounterparty"
    host_user_id:
      type: string
    booker_user_id:
      type: string
    slot_start_utc:
      type: string
      format: date-time
    slot_end_utc:
      type: string
      format: date-time
    gross_cents:
      type: integer
    platform_fee_cents:
      type: integer
    host_payout_cents:
      type: integer
BookingCancellationPreview:
  type: object
  additionalProperties: false
  required: [object, booking_id, cancelled_by, gross_cents, refund_cents, host_payout_cents, platform_fee_cents, previewed_at, policy_cutoff_at]
  properties:
    object:
      type: string
      enum: [booking_cancellation_preview]
    booking_id:
      type: string
    cancelled_by:
      type: string
      enum: [host, booker]
    gross_cents:
      type: integer
    refund_cents:
      type: integer
    host_payout_cents:
      type: integer
    platform_fee_cents:
      type: integer
    previewed_at:
      type: string
      format: date-time
    policy_cutoff_at:
      type: string
      format: date-time
      nullable: true
CancelBookingRequest:
  type: object
  additionalProperties: false
  properties:
    expected_refund_cents:
      type: integer
      minimum: 0
      description: Transitional compatibility field; when provided, cancellation fails if the authoritative refund has changed.
BookingSessionAttachResponse:
  type: object
  additionalProperties: true
  required: [session_id, party, channel, agora]
  properties:
    session_id:
      type: string
    party:
      type: string
      enum: [host, booker]
    channel:
      type: string
    agora:
      type: object
      nullable: true
      additionalProperties: true
ResolveBookingSettlementReviewRequest:
  type: object
  additionalProperties: false
  required: [resolution, expected_review_version]
  properties:
    resolution:
      type: string
      enum: [completed, no_show_host, no_show_booker]
    expected_review_version:
      type: integer
      minimum: 0
    note:
      type: string
      nullable: true
ResolveBookingSettlementReviewResponse:
  type: object
  additionalProperties: true
  required: [booking, resolution, pending_settlement, replayed]
  properties:
    booking:
      $ref: "#/Booking"
    resolution:
      type: string
      enum: [completed, no_show_host, no_show_booker]
    pending_settlement:
      type: boolean
    replayed:
      type: boolean

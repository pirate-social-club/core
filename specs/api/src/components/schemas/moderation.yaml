ModerationSignalSeverity:
  type: string
  enum:
    - low
    - medium
    - high
ModerationCaseStatus:
  type: string
  enum:
    - open
    - resolved
ModerationQueueScope:
  type: string
  enum:
    - community
    - platform
ModerationCaseOpenedBy:
  type: string
  enum:
    - platform_analysis
    - user_report
    - mixed
UserReportReasonCode:
  type: string
  enum:
    - spam
    - harassment
    - hate
    - sexual_content
    - graphic_content
    - misleading
    - other
ModerationActionType:
  type: string
  enum:
    - dismiss
    - hide
    - remove
    - restore
    - age_gate
    - set_content_rating
    - quarantine_asset
    - block_asset
    - restore_asset
CreateUserReportRequest:
  type: object
  additionalProperties: false
  required:
    - reason_code
  properties:
    reason_code:
      $ref: ./moderation.yaml#/UserReportReasonCode
    note:
      type: string
      nullable: true
UserReport:
  type: object
  required:
    - id
    - object
    - community
    - post
    - comment
    - asset
    - reporter_user
    - reason_code
    - created
  properties:
    id:
      type: string
      readOnly: true
    object:
      type: string
      readOnly: true
      enum:
        - user_report
    community:
      type: string
    post:
      type: string
      nullable: true
    comment:
      type: string
      nullable: true
    asset:
      type: string
      nullable: true
    reporter_user:
      type: string
    reason_code:
      $ref: ./moderation.yaml#/UserReportReasonCode
    note:
      type: string
      nullable: true
    created:
      type: integer
      format: int64
ModerationSignal:
  type: object
  required:
    - id
    - object
    - community
    - post
    - comment
    - analysis_result_ref
    - source
    - signal_type
    - severity
    - provider
    - provider_label
    - created
  properties:
    id:
      type: string
      readOnly: true
    object:
      type: string
      readOnly: true
      enum:
        - moderation_signal
    community:
      type: string
    post:
      type: string
      nullable: true
    comment:
      type: string
      nullable: true
    analysis_result_ref:
      type: string
      nullable: true
    source:
      type: string
      enum:
        - platform_analysis
    signal_type:
      type: string
    severity:
      $ref: ./moderation.yaml#/ModerationSignalSeverity
    provider:
      type: string
    provider_label:
      type: string
    evidence_ref:
      type: string
      nullable: true
    previous_post_status:
      type: string
      nullable: true
      enum: [draft, published, hidden, removed, deleted]
    next_post_status:
      type: string
      nullable: true
      enum: [draft, published, hidden, removed, deleted]
    previous_asset_enforcement_state:
      type: string
      nullable: true
      enum: [active, quarantined, blocked]
    next_asset_enforcement_state:
      type: string
      nullable: true
      enum: [active, quarantined, blocked]
    created:
      type: integer
      format: int64
ModerationAction:
  type: object
  required:
    - id
    - object
    - moderation_case
    - community
    - post
    - comment
    - actor_user
    - action_type
    - created
  properties:
    id:
      type: string
      readOnly: true
    object:
      type: string
      readOnly: true
      enum:
        - moderation_action
    moderation_case:
      type: string
    community:
      type: string
    post:
      type: string
      nullable: true
    comment:
      type: string
      nullable: true
    actor_user:
      type: string
    action_type:
      $ref: ./moderation.yaml#/ModerationActionType
    note:
      type: string
      nullable: true
    previous_content_safety_state:
      type: string
      nullable: true
      enum: [pending, safe, sensitive, adult]
    next_content_safety_state:
      type: string
      nullable: true
      enum: [safe, sensitive, adult]
    previous_age_gate_policy:
      type: string
      nullable: true
      enum: [none, 18_plus]
    next_age_gate_policy:
      type: string
      nullable: true
      enum: [none, 18_plus]
    evidence_ref:
      type: string
      nullable: true
    created:
      type: integer
      format: int64
ModerationCase:
  type: object
  required:
    - id
    - object
    - community
    - post
    - comment
    - status
    - queue_scope
    - priority
    - opened_by
    - created
  properties:
    id:
      type: string
      readOnly: true
    object:
      type: string
      readOnly: true
      enum:
        - moderation_case
    community:
      type: string
    post:
      type: string
      nullable: true
    comment:
      type: string
      nullable: true
    status:
      $ref: ./moderation.yaml#/ModerationCaseStatus
    queue_scope:
      $ref: ./moderation.yaml#/ModerationQueueScope
    priority:
      $ref: ./moderation.yaml#/ModerationSignalSeverity
    opened_by:
      $ref: ./moderation.yaml#/ModerationCaseOpenedBy
    created:
      type: integer
      format: int64
    resolved_at:
      type: integer
      format: int64
      nullable: true
ModerationCasePostPreview:
  type: object
  additionalProperties: false
  required:
    - post_id
    - post_type
    - status
    - title
    - body
    - caption
    - media_refs_json
    - author_handle
  properties:
    post_id:
      type: string
    post_type:
      type: string
    status:
      type: string
    title:
      type: string
      nullable: true
    body:
      type: string
      nullable: true
    caption:
      type: string
      nullable: true
    media_refs_json:
      type: string
      nullable: true
    author_handle:
      type: string
      nullable: true
ModerationCaseListItem:
  allOf:
    - $ref: ./moderation.yaml#/ModerationCase
    - type: object
      additionalProperties: false
      required:
        - post
      properties:
        post:
          $ref: ./moderation.yaml#/ModerationCasePostPreview
          nullable: true
ModerationCaseListResponse:
  type: object
  required:
    - items
    - next_cursor
  properties:
    items:
      type: array
      items:
        $ref: ./moderation.yaml#/ModerationCaseListItem
    next_cursor:
      type: string
      nullable: true
ModerationCaseDetail:
  type: object
  required:
    - case
    - post
    - comment
    - signals
    - reports
    - actions
  properties:
    case:
      $ref: ./moderation.yaml#/ModerationCase
    post:
      $ref: ./posts.yaml#/Post
      nullable: true
    comment:
      $ref: ./comments.yaml#/Comment
      nullable: true
    signals:
      type: array
      items:
        $ref: ./moderation.yaml#/ModerationSignal
    reports:
      type: array
      items:
        $ref: ./moderation.yaml#/UserReport
    actions:
      type: array
      items:
        $ref: ./moderation.yaml#/ModerationAction
CreateModerationActionRequest:
  type: object
  additionalProperties: false
  required:
    - action_type
  properties:
    action_type:
      $ref: ./moderation.yaml#/ModerationActionType
    note:
      type: string
      nullable: true
    content_safety_state:
      type: string
      enum: [safe, sensitive, adult]
    evidence_ref:
      type: string
      nullable: true
MediaAnalysisResult:
  type: object
  additionalProperties: false
  required:
    - media_analysis_result_id
    - community_id
    - source_post_id
    - source_asset_id
    - outcome
    - content_safety_state
    - age_gate_policy
    - trigger_sources
    - acrcloud_music_match
    - acrcloud_custom_match
    - acrcloud_error_code
    - acrcloud_error_message
    - acrcloud_checked_at
    - safety_signals
    - authenticity_signals
    - policy_reason_code
    - policy_reason
    - resolved_at
    - created_at
    - updated_at
  properties:
    media_analysis_result_id:
      type: string
    community_id:
      type: string
    source_post_id:
      type: string
      nullable: true
    source_asset_id:
      type: string
      nullable: true
    outcome:
      type: string
      enum: [allow, allow_with_required_reference, review_required, blocked]
    content_safety_state:
      type: string
      enum: [pending, safe, sensitive, adult]
    age_gate_policy:
      type: string
      enum: [none, 18_plus]
    trigger_sources:
      nullable: true
    acrcloud_music_match:
      nullable: true
    acrcloud_custom_match:
      nullable: true
    acrcloud_error_code:
      type: string
      nullable: true
    acrcloud_error_message:
      type: string
      nullable: true
    acrcloud_checked_at:
      type: string
      format: date-time
      nullable: true
    safety_signals:
      nullable: true
    authenticity_signals:
      nullable: true
    policy_reason_code:
      type: string
      nullable: true
    policy_reason:
      type: string
      nullable: true
    resolved_at:
      type: string
      format: date-time
      nullable: true
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
RightsReviewCase:
  type: object
  additionalProperties: false
  required:
    - rights_review_case_id
    - subject_type
    - subject_id
    - community_id
    - status
    - trigger_source
    - analysis_result_ref
    - submitted_evidence_refs
    - resolution
    - resolver_user_id
    - created_at
    - updated_at
    - resolved_at
  properties:
    rights_review_case_id:
      type: string
    subject_type:
      type: string
      enum: [asset, post, live_room, replay_asset]
    subject_id:
      type: string
    community_id:
      type: string
    status:
      type: string
      enum: [open, under_review, resolved, blocked]
    trigger_source:
      type: string
      enum: [acrcloud_match, declared_reference_mismatch, manual_report, operator_escalation]
    analysis_result_ref:
      type: string
      nullable: true
    submitted_evidence_refs:
      nullable: true
    resolution:
      type: string
      enum: [clear, clear_with_upstream_refs, block, needs_more_evidence]
      nullable: true
    resolver_user_id:
      type: string
      nullable: true
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
    resolved_at:
      type: string
      format: date-time
      nullable: true
RightsReviewCaseListItem:
  allOf:
    - $ref: ./moderation.yaml#/RightsReviewCase
    - type: object
      additionalProperties: false
      required:
        - story_royalty_registration_status
        - analysis
        - post
      properties:
        story_royalty_registration_status:
          type: string
          enum: [none, pending, registered, failed]
          nullable: true
        analysis:
          $ref: ./moderation.yaml#/MediaAnalysisResult
          nullable: true
        post:
          $ref: ./moderation.yaml#/ModerationCasePostPreview
          nullable: true
RightsReviewCaseListResponse:
  type: object
  required:
    - items
    - next_cursor
  properties:
    items:
      type: array
      items:
        $ref: ./moderation.yaml#/RightsReviewCaseListItem
    next_cursor:
      type: string
      nullable: true
RightsReviewCaseDetail:
  type: object
  required:
    - case
    - analysis
    - post
  properties:
    case:
      $ref: ./moderation.yaml#/RightsReviewCase
    analysis:
      $ref: ./moderation.yaml#/MediaAnalysisResult
      nullable: true
    post:
      $ref: ./posts.yaml#/Post
      nullable: true
CreateRightsReviewActionRequest:
  type: object
  additionalProperties: false
  required:
    - action_type
  properties:
    action_type:
      type: string
      enum: [start_review, clear, clear_with_upstream_refs, needs_more_evidence, block]
    evidence_refs:
      type: array
      nullable: true
      items:
        type: string

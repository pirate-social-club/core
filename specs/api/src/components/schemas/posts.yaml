ImageMediaDescriptor:
  type: object
  description: |
    Media descriptor constrained to image MIME types for image posts. The server should reject
    any item whose `mime_type` does not start with `image/`.
  required:
    - storage_ref
    - mime_type
  properties:
    storage_ref:
      type: string
    mime_type:
      type: string
      pattern: ^image/
    size_bytes:
      type: integer
      nullable: true
    content_hash:
      type: string
      nullable: true
    width:
      type: integer
      nullable: true
    height:
      type: integer
      nullable: true
VideoMediaDescriptor:
  type: object
  description: |
    Media descriptor constrained to video MIME types for video posts. The server should reject
    any item whose `mime_type` does not start with `video/`. `poster_*` fields describe a
    public poster image derived from a selected video frame; locked video posts may expose
    poster fields while omitting the raw video storage reference from read models.
  required:
    - storage_ref
    - mime_type
  properties:
    storage_ref:
      type: string
    mime_type:
      type: string
      pattern: ^video/
    size_bytes:
      type: integer
      nullable: true
    content_hash:
      type: string
      nullable: true
    duration_ms:
      type: integer
      nullable: true
    width:
      type: integer
      nullable: true
    height:
      type: integer
      nullable: true
    poster_ref:
      type: string
      nullable: true
    poster_mime_type:
      type: string
      nullable: true
      pattern: ^image/
    poster_size_bytes:
      type: integer
      nullable: true
    poster_width:
      type: integer
      nullable: true
    poster_height:
      type: integer
      nullable: true
    poster_frame_ms:
      type: integer
      nullable: true
    preview_video:
      $ref: ./song-artifacts.yaml#/SongVideoArtifactDescriptor
      nullable: true
AudioMediaDescriptor:
  type: object
  description: |
    Media descriptor constrained to audio MIME types for song posts. The server should reject
    any item whose `mime_type` does not start with `audio/`.
  required:
    - storage_ref
    - mime_type
  properties:
    storage_ref:
      type: string
    mime_type:
      type: string
      pattern: ^audio/
    size_bytes:
      type: integer
      nullable: true
    content_hash:
      type: string
      nullable: true
    duration_ms:
      type: integer
      nullable: true
RoyaltyAllocationRequest:
  type: object
  description: |
    One recipient of a declared initial royalty split for a song or rights-bearing
    video asset. The server re-validates the full split (exactly one creator, shares
    totalling 10000 bps, unique wallets, at most 10 recipients) atomically with asset
    creation and persists it as a draft agreement; it is not trusted from the client.
    See core/specs/domain/royalty-allocation.md.
  required:
    - recipient_kind
    - wallet_address
    - share_bps
  properties:
    recipient_kind:
      type: string
      enum:
        - creator
        - collaborator
    wallet_address:
      type: string
      description: EVM (Story-chain) wallet address that receives royalty tokens.
    share_bps:
      type: integer
      minimum: 1
      maximum: 10000
      description: Share of the split in basis points (1 bps = 0.01%); shares total 10000.

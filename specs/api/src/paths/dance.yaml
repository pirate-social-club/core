dance_sessions:
  post:
    x-implemented: true
    operationId: dance_session_create
    tags:
      - Dance
    summary: Create an expiring dance upload session
    parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/dance.yaml#/DanceSessionCreateRequest
    responses:
      "200":
        description: Existing session for the idempotency key
        content:
          application/json:
            schema:
              $ref: ../components/schemas/dance.yaml#/DanceSessionMutationResponse
      "201":
        description: Dance session created
        content:
          application/json:
            schema:
              $ref: ../components/schemas/dance.yaml#/DanceSessionMutationResponse
      "400":
        $ref: ../components/responses.yaml#/ValidationError
      "401":
        $ref: ../components/responses.yaml#/AuthError
      "409":
        $ref: ../components/responses.yaml#/Conflict
      "503":
        $ref: ../components/responses.yaml#/ServiceUnavailable
dance_sessions_by_dance_session_id:
  parameters:
    - in: path
      name: dance_session_id
      required: true
      schema:
        type: string
  get:
    x-implemented: true
    operationId: dance_session_retrieve
    tags:

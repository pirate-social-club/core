dance_sessions_by_dance_session_id:
  parameters:
    - in: path
      name: dance_session_id
      required: true
      schema:
        type: string
  get:
    x-implemented: true
    operationId: dance_session_retrieve
    tags:
      - Dance
    summary: Get an owned dance session
    responses:
      "200":
        description: Current session state
        content:
          application/json:
            schema:
              $ref: ../components/schemas/dance.yaml#/DanceSession
      "401":
        $ref: ../components/responses.yaml#/AuthError
      "404":
        $ref: ../components/responses.yaml#/NotFound
dance_sessions_by_dance_session_id_cancel:
  parameters:
    - in: path
      name: dance_session_id
      required: true
      schema:
        type: string
  post:
    x-implemented: true
    operationId: dance_session_cancel
    tags:
      - Dance
    summary: Cancel an owned unsubmitted dance session
    responses:
      "200":
        description: Cancelled or already-cancelled session
        content:
          application/json:
            schema:
              $ref: ../components/schemas/dance.yaml#/DanceSession
      "401":
        $ref: ../components/responses.yaml#/AuthError
      "404":
        $ref: ../components/responses.yaml#/NotFound
      "409":
        $ref: ../components/responses.yaml#/Conflict

me_rewards:
  get:
    x-implemented: true
    operationId: me_rewards
    tags:
      - Rewards
    summary: Get the current user's rewards ledger summary
    responses:
      "200":
        description: Rewards summary
        content:
          application/json:
            schema:
              $ref: ../components/schemas/rewards.yaml#/RewardsSummaryResponse
me_rewards_identity_binding:
  get:
    x-implemented: true
    operationId: me_rewards_identity_binding_retrieve
    tags:
      - Rewards
    summary: Get explicit reward-document selection state
    responses:
      "200":
        description: Current binding and eligible Self documents
        content:
          application/json:
            schema:
              $ref: ../components/schemas/rewards.yaml#/RewardIdentityBindingResponse
  post:
    x-implemented: true
    operationId: me_rewards_identity_binding_create
    tags:
      - Rewards
    summary: Select an eligible Self document for future reward evaluation
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/rewards.yaml#/RewardIdentityBindingSelectRequest
    responses:
      "201":
        description: Active reward identity binding
        content:
          application/json:
            schema:
              $ref: ../components/schemas/rewards.yaml#/RewardIdentityBindingResponse
      "409":
        description: An active binding already exists or the document is not selectable
me_rewards_cashouts:
  post:
    x-implemented: true
    operationId: me_rewards_cashouts
    tags:
      - Rewards
    summary: Claim off-chain reward credits to the user's wallet
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/rewards.yaml#/RewardCashoutRequest
    responses:
      "202":
        description: Cashout submitted or confirmed
        content:
          application/json:
            schema:
              $ref: ../components/schemas/rewards.yaml#/RewardCashoutResponse
me_rewards_cashouts_by_cashout_id:
  parameters:
    - name: cashout_id
      in: path
      required: true
      schema:
        type: string
  get:
    x-implemented: true
    operationId: me_rewards_cashouts_by_cashout_id
    tags:
      - Rewards
    summary: Get an authoritative reward cashout status
    responses:
      "200":
        description: Current cashout status and available balance
        content:
          application/json:
            schema:
              $ref: ../components/schemas/rewards.yaml#/RewardCashoutResponse
      "404":
        description: Cashout not found for the current user
reward_campaign_capabilities:
  get:
    x-implemented: true
    operationId: reward_campaign_capabilities_retrieve
    tags:
      - Rewards
    summary: Get live campaign-creation guardrails
    description: >-
      Clients validate proposed campaign terms against the running configuration
      rather than hardcoding it, and hide the boost entry point entirely when the
      surface is disabled.
    parameters:
      - in: query
        name: post_id
        required: true
        schema:
          type: string
          minLength: 1
        description: Song post whose campaign eligibility should be evaluated.
    responses:
      "200":
        description: Campaign creation capabilities
        content:
          application/json:
            schema:
              $ref: ../components/schemas/rewards.yaml#/RewardCampaignCapabilities
reward_campaigns:
  get:
    x-implemented: true
    operationId: reward_campaigns_resolve
    tags:
      - Rewards
    summary: Resolve the permanent reward pool for a song post
    description: >-
      Returns the non-terminal campaign currently occupying the song pool so an
      authenticated user can contribute without relying on browser-local campaign
      history. Ended and canceled campaigns have released the pool and are not returned.
    parameters:
      - name: community_id
        in: query
        required: true
        schema:
          type: string
      - name: post_id
        in: query
        required: true
        schema:
          type: string
      - name: objective
        in: query
        required: false
        description: Restrict resolution to the Study or Karaoke objective slot.
        schema:
          $ref: ../components/schemas/rewards.yaml#/RewardCampaignObjective
    responses:
      "200":
        description: Current permanent song-pool campaign
        content:
          application/json:
            schema:
              $ref: ../components/schemas/rewards.yaml#/RewardCampaign
      "404":
        description: No non-terminal song pool was found
  post:
    x-implemented: true
    operationId: reward_campaigns_create
    tags:
      - Rewards
    summary: Create a draft, budget-backed song-practice campaign
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/rewards.yaml#/RewardCampaignCreateRequest
    responses:
      "201":
        description: Draft campaign
        content:
          application/json:
            schema:
              $ref: ../components/schemas/rewards.yaml#/PublicRewardOffer
      "409":
        description: Idempotency conflict or an existing live campaign owns the song post
reward_song_policies_by_target:
  parameters:
    - name: community_id
      in: path
      required: true
      schema:
        type: string
    - name: post_id
      in: path
      required: true
      schema:
        type: string
  get:
    x-implemented: true
    operationId: reward_song_policies_retrieve
    tags:
      - Rewards
    summary: Get a song owner's third-party reward policy
    responses:
      "200":
        description: Song reward policy
        content:
          application/json:
            schema:
              $ref: ../components/schemas/rewards.yaml#/RewardSongOwnerPolicy
  put:
    x-implemented: true
    operationId: reward_song_policies_update
    tags:
      - Rewards
    summary: Update a song owner's third-party reward policy
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/rewards.yaml#/RewardSongOwnerPolicyUpdateRequest
    responses:
      "200":
        description: Updated song reward policy
        content:
          application/json:
            schema:
              $ref: ../components/schemas/rewards.yaml#/RewardSongOwnerPolicy
      "404":
        description: Song policy not found for the current owner
reward_campaigns_by_campaign_id:
  parameters:
    - name: campaign_id
      in: path
      required: true
      schema:
        type: string
  get:
    x-implemented: true
    operationId: reward_campaigns_retrieve
    tags:
      - Rewards
    summary: Retrieve a song-practice reward campaign
    responses:
      "200":
        description: Campaign
        content:
          application/json:
            schema:
              $ref: ../components/schemas/rewards.yaml#/RewardCampaign
      "404":
        description: Campaign not found
reward_campaigns_by_campaign_id_cancel:
  parameters:
    - name: campaign_id
      in: path
      required: true
      schema:
        type: string
  post:
    x-implemented: true
    operationId: reward_campaigns_cancel
    tags:
      - Rewards
    summary: Cancel an unfunded draft reward campaign
    description: >-
      The campaign rewarder may cancel only a draft that has no funding effect
      and no funded, reserved, credited, paid, or refunded balance. Cancellation
      releases the song pool slot. Replays return the same canceled campaign.
    responses:
      "200":
        description: Canceled campaign
        content:
          application/json:
            schema:
              $ref: ../components/schemas/rewards.yaml#/RewardCampaign
      "404":
        description: Campaign not found for the current rewarder
      "409":
        description: Campaign is not an unfunded draft and cannot be canceled
public_reward_campaigns:
  get:
    x-implemented: true
    operationId: public_reward_campaigns_resolve
    tags:
      - Rewards
    summary: Resolve the active reward offer for a published song post
    parameters:
      - name: community_id
        in: query
        required: true
        schema:
          type: string
      - name: post_id
        in: query
        required: true
        schema:
          type: string
      - name: objective
        in: query
        required: false
        description: Restrict the active offer to the Study or Karaoke objective slot.
        schema:
          $ref: ../components/schemas/rewards.yaml#/RewardCampaignObjective
    responses:
      "200":
        description: Active campaign offer
        content:
          application/json:
            schema:
              $ref: ../components/schemas/rewards.yaml#/PublicRewardOffer
      "404":
        description: No active campaign offer was found
public_reward_campaigns_by_campaign_id:
  parameters:
    - name: campaign_id
      in: path
      required: true
      schema:
        type: string
  get:
    x-implemented: true
    operationId: public_reward_campaigns_retrieve
    tags:
      - Rewards
    summary: Retrieve a currently active public song-practice offer
    responses:
      "200":
        description: Active campaign offer
        content:
          application/json:
            schema:
              $ref: ../components/schemas/rewards.yaml#/PublicRewardOffer
      "404":
        description: No active campaign offer was found
operator_reward_campaign_incident_recovery:
  parameters:
    - name: campaign_id
      in: path
      required: true
      schema:
        type: string
    - name: incident_id
      in: path
      required: true
      schema:
        type: string
  post:
    x-implemented: true
    operationId: operator_reward_campaign_incident_recover
    tags:
      - Rewards
    summary: Recover a healthy campaign from an operational hold
    description: Requires an operator credential with the rewards:campaign-incidents:resolve scope.
    security:
      - operatorCredentialAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/rewards.yaml#/RewardCampaignIncidentRecoveryRequest
    responses:
      "200":
        description: Incident resolved and campaign lifecycle restored
        content:
          application/json:
            schema:
              $ref: ../components/schemas/rewards.yaml#/RewardCampaignIncidentRecoveryResponse
      "401":
        description: Missing or invalid operator credential
      "403":
        description: Operator credential lacks the recovery scope
      "409":
        description: Incident changed, campaign is unhealthy, or another holding incident remains
operator_reward_pool_refund_policy_readiness:
  get:
    x-implemented: true
    operationId: operator_reward_pool_refund_policy_readiness
    tags:
      - Rewards
    summary: Check whether a proposed vault refund limit preserves outstanding contribution lots
    description: >-
      Operator-only governance preflight. Requires an operator credential with the
      rewards:settlement:read scope. The response contains sensitive live liability information
      and must not be exposed through a public or user-authenticated surface.
    security:
      - operatorCredentialAuth: []
    parameters:
      - name: proposed_max_refund_atomic
        in: query
        required: false
        description: Proposed canonical USDC refund limit in atomic six-decimal units.
        schema:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
    responses:
      "200":
        description: Largest outstanding contribution lot and proposal safety result
        content:
          application/json:
            schema:
              $ref: ../components/schemas/rewards.yaml#/RewardPoolRefundPolicyReadiness
      "400":
        description: Proposed refund limit is not a canonical non-negative integer
      "401":
        description: Missing or invalid operator credential
      "403":
        description: Operator credential lacks the rewards settlement read scope
operator_reward_settlement_backend_flip_readiness:
  get:
    x-implemented: true
    operationId: operator_reward_settlement_backend_flip_readiness
    tags:
      - Rewards
    summary: Check whether rewards custody can switch without stranding in-flight effects
    description: >-
      Operator-only backend-flip drain preflight. Requires an operator credential with the
      rewards:settlement:read scope.
    security:
      - operatorCredentialAuth: []
    responses:
      "200":
        description: Current non-terminal reward effect counts and readiness decision
        content:
          application/json:
            schema:
              $ref: ../components/schemas/rewards.yaml#/RewardBackendFlipReadiness
      "401":
        description: Missing or invalid operator credential
      "403":
        description: Operator credential lacks the rewards settlement read scope
operator_reward_settlement_solvency_readiness:
  get:
    x-implemented: true
    operationId: operator_reward_settlement_solvency_readiness
    tags:
      - Rewards
    summary: Read the freshness-gated rewards solvency admission decision
    description: >-
      Operator-only readiness surface exposing current float, liability, and observation
      freshness. Requires an operator credential with the rewards:settlement:read scope. These
      values reveal the vault's current loss capacity and must remain operator-confidential.
    security:
      - operatorCredentialAuth: []
    responses:
      "200":
        description: Current rewards solvency gate state
        content:
          application/json:
            schema:
              $ref: ../components/schemas/rewards.yaml#/RewardSolvencyReadiness
      "401":
        description: Missing or invalid operator credential
      "403":
        description: Operator credential lacks the rewards settlement read scope

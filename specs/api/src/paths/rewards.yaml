me_rewards:
  get:
    x-implemented: true
    operationId: me_rewards
    tags:
      - Rewards
    summary: Get the current user's rewards ledger summary
    responses:
      "200":
        description: Rewards summary
        content:
          application/json:
            schema:
              $ref: ../components/schemas/rewards.yaml#/RewardsSummaryResponse
me_rewards_cashouts:
  post:
    x-implemented: true
    operationId: me_rewards_cashouts
    tags:
      - Rewards
    summary: Claim off-chain reward credits to the user's wallet
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/rewards.yaml#/RewardCashoutRequest
    responses:
      "202":
        description: Cashout submitted or confirmed
        content:
          application/json:
            schema:
              $ref: ../components/schemas/rewards.yaml#/RewardCashoutResponse
me_rewards_cashouts_by_cashout_id:
  parameters:
    - name: cashout_id
      in: path
      required: true
      schema:
        type: string
  get:
    x-implemented: true
    operationId: me_rewards_cashouts_by_cashout_id
    tags:
      - Rewards
    summary: Get an authoritative reward cashout status
    responses:
      "200":
        description: Current cashout status and available balance
        content:
          application/json:
            schema:
              $ref: ../components/schemas/rewards.yaml#/RewardCashoutResponse
      "404":
        description: Cashout not found for the current user
reward_campaign_capabilities:
  get:
    x-implemented: true
    operationId: reward_campaign_capabilities_retrieve
    tags:
      - Rewards
    summary: Get live campaign-creation guardrails
    description: >-
      Clients validate proposed campaign terms against the running configuration
      rather than hardcoding it, and hide the boost entry point entirely when the
      surface is disabled.
    responses:
      "200":
        description: Campaign creation capabilities
        content:
          application/json:
            schema:
              $ref: ../components/schemas/rewards.yaml#/RewardCampaignCapabilities
reward_campaigns:
  post:
    x-implemented: true
    operationId: reward_campaigns_create
    tags:
      - Rewards
    summary: Create a draft, budget-backed song-practice campaign
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/rewards.yaml#/RewardCampaignCreateRequest
    responses:
      "201":
        description: Draft campaign
        content:
          application/json:
            schema:
              $ref: ../components/schemas/rewards.yaml#/PublicRewardOffer
      "409":
        description: Idempotency conflict or an existing live campaign owns the song post
reward_song_policies_by_target:
  parameters:
    - name: community_id
      in: path
      required: true
      schema:
        type: string
    - name: post_id
      in: path
      required: true
      schema:
        type: string
  get:
    x-implemented: true
    operationId: reward_song_policies_retrieve
    tags:
      - Rewards
    summary: Get a song owner's third-party reward policy
    responses:
      "200":
        description: Song reward policy
        content:
          application/json:
            schema:
              $ref: ../components/schemas/rewards.yaml#/RewardSongOwnerPolicy
  put:
    x-implemented: true
    operationId: reward_song_policies_update
    tags:
      - Rewards
    summary: Update a song owner's third-party reward policy
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/rewards.yaml#/RewardSongOwnerPolicyUpdateRequest
    responses:
      "200":
        description: Updated song reward policy
        content:
          application/json:
            schema:
              $ref: ../components/schemas/rewards.yaml#/RewardSongOwnerPolicy
      "404":
        description: Song policy not found for the current owner
reward_campaigns_by_campaign_id:
  parameters:
    - name: campaign_id
      in: path
      required: true
      schema:
        type: string
  get:
    x-implemented: true
    operationId: reward_campaigns_retrieve
    tags:
      - Rewards
    summary: Retrieve a song-practice reward campaign
    responses:
      "200":
        description: Campaign
        content:
          application/json:
            schema:
              $ref: ../components/schemas/rewards.yaml#/RewardCampaign
      "404":
        description: Campaign not found
public_reward_campaigns:
  get:
    x-implemented: true
    operationId: public_reward_campaigns_resolve
    tags:
      - Rewards
    summary: Resolve the active reward offer for a published song post
    parameters:
      - name: community_id
        in: query
        required: true
        schema:
          type: string
      - name: post_id
        in: query
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Active campaign offer
        content:
          application/json:
            schema:
              $ref: ../components/schemas/rewards.yaml#/PublicRewardOffer
      "404":
        description: No active campaign offer was found
public_reward_campaigns_by_campaign_id:
  parameters:
    - name: campaign_id
      in: path
      required: true
      schema:
        type: string
  get:
    x-implemented: true
    operationId: public_reward_campaigns_retrieve
    tags:
      - Rewards
    summary: Retrieve a currently active public song-practice offer
    responses:
      "200":
        description: Active campaign offer
        content:
          application/json:
            schema:
              $ref: ../components/schemas/rewards.yaml#/PublicRewardOffer
      "404":
        description: No active campaign offer was found
operator_reward_campaign_incident_recovery:
  parameters:
    - name: campaign_id
      in: path
      required: true
      schema:
        type: string
    - name: incident_id
      in: path
      required: true
      schema:
        type: string
  post:
    x-implemented: true
    operationId: operator_reward_campaign_incident_recover
    tags:
      - Rewards
    summary: Recover a healthy campaign from an operational hold
    description: Requires an operator credential with the rewards:campaign-incidents:resolve scope.
    security:
      - operatorCredentialAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/rewards.yaml#/RewardCampaignIncidentRecoveryRequest
    responses:
      "200":
        description: Incident resolved and campaign lifecycle restored
        content:
          application/json:
            schema:
              $ref: ../components/schemas/rewards.yaml#/RewardCampaignIncidentRecoveryResponse
      "401":
        description: Missing or invalid operator credential
      "403":
        description: Operator credential lacks the recovery scope
      "409":
        description: Incident changed, campaign is unhealthy, or another holding incident remains
reward_campaign_funding_quotes:
  parameters:
    - name: campaign_id
      in: path
      required: true
      schema:
        type: string
  post:
    x-implemented: true
    operationId: reward_campaign_funding_quotes_create
    tags:
      - Rewards
    summary: Quote a direct Base USDC campaign funding transfer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/rewards.yaml#/RewardCampaignFundingQuoteRequest
    responses:
      "201":
        description: Funding quote
        content:
          application/json:
            schema:
              $ref: ../components/schemas/rewards.yaml#/RewardCampaignFundingQuote
      "409":
        description: Idempotency conflict or campaign terms no longer accept funding
reward_campaign_funding_quotes_confirm:
  parameters:
    - name: campaign_id
      in: path
      required: true
      schema:
        type: string
    - name: funding_quote_id
      in: path
      required: true
      schema:
        type: string
  post:
    x-implemented: true
    operationId: reward_campaign_funding_quotes_confirm
    tags:
      - Rewards
    summary: Verify and uniquely bind a Base USDC receipt to a campaign
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/rewards.yaml#/RewardCampaignFundingConfirmRequest
    responses:
      "200":
        description: Confirmed or still-confirming funding effect
        content:
          application/json:
            schema:
              $ref: ../components/schemas/rewards.yaml#/RewardCampaignFundingQuote
      "409":
        description: Receipt was already consumed or conflicts with the quote

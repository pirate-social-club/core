communities_by_community_id_learning_decks:
  post:
    x-implemented: true
    tags: [Learning Decks]
    summary: Create a learning deck draft
    parameters:
      - $ref: ../components/parameters.yaml#/CommunityId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/learning-decks.yaml#/LearningDeckCreateRequest
    responses:
      "201":
        description: Learning deck draft
        content:
          application/json:
            schema:
              $ref: ../components/schemas/learning-decks.yaml#/LearningDeckDraft
      "400": { $ref: ../components/responses.yaml#/BadRequest }
      "401": { $ref: ../components/responses.yaml#/AuthError }
      "403": { $ref: ../components/responses.yaml#/Forbidden }
      "404": { $ref: ../components/responses.yaml#/NotFound }

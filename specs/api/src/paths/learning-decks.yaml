communities_by_community_id_learning_decks_imports_preview:
  post:
    x-implemented: true
    tags: [Learning Decks]
    summary: Queue or read a durable CSV import preview
    description: |
      The server queues parsing of a verified `deck_import_csv_v1` content blob.
      The returned job status is durable and idempotent; callers poll the import
      status path until the bounded deterministic preview is ready.
    parameters:
      - $ref: ../components/parameters.yaml#/CommunityId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/learning-decks.yaml#/LearningDeckCsvImportPreviewRequest
    responses:
      "200":
        description: Durable import job status and optional preview
        content:
          application/json:
            schema:
              $ref: ../components/schemas/learning-decks.yaml#/LearningDeckCsvImportStatus
      "400": { $ref: ../components/responses.yaml#/BadRequest }
      "401": { $ref: ../components/responses.yaml#/AuthError }
      "404": { $ref: ../components/responses.yaml#/NotFound }
communities_by_community_id_learning_decks_imports_by_import_job_id:

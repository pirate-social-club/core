gate_capabilities_nft_sources:
  get:
    x-implemented: true
    tags:
      - Gate Capabilities
    summary: List trusted NFT gate authoring sources
    description: |
      Returns stable Pirate source descriptors available to an authenticated community moderator.
      The response is advisory; save-time gate validation remains authoritative. Vendor index names,
      endpoints, and credentials are never exposed through this surface.
    operationId: listNftGateCapabilitySources
    responses:
      "200":
        description: Trusted NFT gate authoring sources
        content:
          application/json:
            schema:
              $ref: ../components/schemas/gate-capabilities.yaml#/NftGateCapabilitySourceListResponse
      "401":
        $ref: ../components/responses.yaml#/AuthError
      "403":
        $ref: ../components/responses.yaml#/Forbidden
      "429":
        $ref: ../components/responses.yaml#/RateLimited

gate_capabilities_nft_source_facet_values:
  get:
    x-implemented: true
    tags:
      - Gate Capabilities
    summary: Search trusted NFT facet values
    description: |
      Searches one canonical facet within a trusted source. Empty queries return a bounded leading
      page and never materialize the complete upstream dictionary. A source outage is explicit and
      must not be interpreted as an empty successful result.
    operationId: searchNftGateFacetValues
    parameters:
      - name: source_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: facet_key
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 120
          default: ""
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          maxLength: 512
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 25
    responses:
      "200":
        description: Canonical facet-value page
        content:
          application/json:
            schema:
              $ref: ../components/schemas/gate-capabilities.yaml#/NftGateFacetValuePage
      "400":
        $ref: ../components/responses.yaml#/BadRequest
      "401":
        $ref: ../components/responses.yaml#/AuthError
      "403":
        $ref: ../components/responses.yaml#/Forbidden
      "404":
        $ref: ../components/responses.yaml#/NotFound
      "429":
        $ref: ../components/responses.yaml#/RateLimited
      "503":
        description: No usable current or last-known-good catalog data is available
        content:
          application/json:
            schema:
              $ref: ../components/schemas/gate-capabilities.yaml#/NftGateCatalogUnavailableResponse

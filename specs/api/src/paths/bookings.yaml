bookings:
  get:
    x-implemented: true
    tags:
      - Bookings
    summary: List the caller's global bookings
    parameters:
      - in: query
        name: role
        schema:
          $ref: ../components/schemas/bookings.yaml#/BookingViewerRole
      - in: query
        name: status
        description: Comma-separated booking status filter.
        schema:
          type: string
      - in: query
        name: source_community_id
        schema:
          type: string
    responses:
      "200":
        description: Global bookings visible to the caller
        content:
          application/json:
            schema:
              $ref: ../components/schemas/bookings.yaml#/BookingListResponse
      "401":
        $ref: ../components/responses.yaml#/AuthError

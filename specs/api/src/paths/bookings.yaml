host_bookings_me_profile:
  get:
    tags: [Bookings]
    x-implemented: true
    summary: Get the authenticated host booking profile
    responses:
      "200":
        description: Host booking profile or empty profile marker
        content:
          application/json:
            schema:
              $ref: ../components/schemas/bookings.yaml#/BookingProfileResponse
      "401":
        $ref: ../components/responses.yaml#/AuthError
  post:
    tags: [Bookings]
    x-implemented: true
    summary: Upsert the authenticated host booking profile
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/bookings.yaml#/UpdateBookingProfileRequest
    responses:
      "200":
        description: Updated host booking profile
        content:
          application/json:
            schema:
              $ref: ../components/schemas/bookings.yaml#/BookingProfile
      "201":
        description: Created host booking profile
        content:
          application/json:
            schema:
              $ref: ../components/schemas/bookings.yaml#/BookingProfile
      "400":
        $ref: ../components/responses.yaml#/BadRequest
      "401":
        $ref: ../components/responses.yaml#/AuthError
      "409":
        $ref: ../components/responses.yaml#/Conflict
host_bookings_me_profile_publish:
  post:
    tags: [Bookings]
    x-implemented: true
    summary: Publish the authenticated host booking profile
    responses:
      "200":
        description: Published host booking profile
        content:
          application/json:
            schema:
              $ref: ../components/schemas/bookings.yaml#/BookingProfile
      "409":
        $ref: ../components/responses.yaml#/Conflict
host_bookings_me_profile_unpublish:
  post:
    tags: [Bookings]
    x-implemented: true
    summary: Unpublish the authenticated host booking profile
    responses:

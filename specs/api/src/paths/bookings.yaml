  get:
    x-implemented: true
    tags:
      - Bookings
    summary: Resolve global booking slots for a host
    parameters:
      - in: path
        name: host_user_id
        required: true
        schema:
          type: string
      - in: query
        name: from
        schema:
          type: string
          format: date-time
      - in: query
        name: to
        schema:
          type: string
          format: date-time
      - in: query
        name: tz
        schema:
          type: string
    responses:
      "200":
        description: Resolved booking slots

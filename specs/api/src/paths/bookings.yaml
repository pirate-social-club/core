            schema:
              type: object
              required: [booking, already_confirmed]
              properties:
                booking:
                  $ref: ../components/schemas/bookings.yaml#/Booking
                already_confirmed:
                  type: boolean
      "201":
        description: Newly confirmed booking
        content:
          application/json:
            schema:
              type: object
              required: [booking, already_confirmed]
              properties:
                booking:
                  $ref: ../components/schemas/bookings.yaml#/Booking
                already_confirmed:
                  type: boolean

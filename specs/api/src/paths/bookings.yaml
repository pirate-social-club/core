  post:
    tags: [Bookings]
    x-implemented: true
    summary: Confirm a paid booking hold
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/bookings.yaml#/ConfirmBookingHoldRequest
    responses:
      "200":
        description: Idempotently confirmed booking

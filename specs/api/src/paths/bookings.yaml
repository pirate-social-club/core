bookings_by_booking_id_settlement_review_resolve:
  post:
    x-implemented: true
    tags:
      - Bookings
    summary: Resolve a global booking settlement review
    description: Operator-only endpoint that resolves an ambiguous attendance review and resumes settlement.
    parameters:
      - in: path
        name: booking_id
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/bookings.yaml#/ResolveBookingSettlementReviewRequest
    responses:
      "200":
        description: Review resolved and settlement finalized or replayed
        content:
          application/json:
            schema:
              $ref: ../components/schemas/bookings.yaml#/ResolveBookingSettlementReviewResponse
      "202":
        description: Review resolved; settlement remains pending and will be retried
        content:
          application/json:
            schema:
              $ref: ../components/schemas/bookings.yaml#/ResolveBookingSettlementReviewResponse
      "400":
        $ref: ../components/responses.yaml#/BadRequest
      "401":
        $ref: ../components/responses.yaml#/AuthError
      "403":
        $ref: ../components/responses.yaml#/Forbidden

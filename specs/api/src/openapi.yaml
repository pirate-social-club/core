openapi: 3.0.3
info:
  title: Pirate API
  version: 0.1.0
  description: |
    Contract-first API surface for Pirate v2.
    This modular source carries the broader planned v0 design surface alongside the first executable slice.
    Operations marked `x-implemented: true` are filtered into `specs/api/openapi-implemented.yaml`, which is the strict generated surface for SDKs and other implementation-bound tooling.

    Resource identifiers are opaque strings with stable type prefixes. Public resource responses
    should expose a canonical `id` field plus an `object` discriminator as schemas are migrated:
    `com_` for communities, `post_` for posts, `cmt_` for comments, `usr_` for users, `vs_` for
    verification sessions, `aos_` for agent ownership sessions, `agt_` for agents, `lst_` for
    listings, `pur_` for purchases, `pq_` for purchase quotes, `job_` for jobs, and `gh_` for
    global handles.
servers:
  - url: https://api.pirate.example
    description: Placeholder production server
security:
  - bearerAuth: []

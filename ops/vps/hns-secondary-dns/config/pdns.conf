launch=gsqlite3
gsqlite3-database=/var/lib/powerdns/pdns.sqlite3
gsqlite3-dnssec=yes

# local-address and allow-notify-from are host-specific command arguments in
# compose.yaml. This static file deliberately contains no IPs or secrets.
local-port=53

primary=no
secondary=yes
autosecondary=yes

# Unknown zones may be created only from a TSIG-signed notification sent by the
# explicitly registered autoprimary. Unsigned autoprovisioning fails closed.
allow-unsigned-autoprimary=no

# This public secondary is a terminal authority, not an AXFR source for third
# parties. Incoming AXFR retrieval from the primary remains enabled.
disable-axfr=yes

api=no
webserver=no

security-poll-suffix=
version-string=anonymous
setuid=
setgid=

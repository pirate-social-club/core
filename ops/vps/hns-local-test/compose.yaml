services:
  primary-init:
    image: powerdns/pdns-auth-51@sha256:f976e753a1de8ec62636203ecb12ae5fa3d1055601be167de53f1f673e0abe59
    user: root
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >-
        if [ ! -f /var/lib/powerdns/pdns.sqlite3 ]; then
          sqlite3 /var/lib/powerdns/pdns.sqlite3 < /usr/local/share/doc/pdns/schema.sqlite3.sql;
        fi;
        chown -R 953:953 /var/lib/powerdns
    volumes:
      - primary-data:/var/lib/powerdns

  secondary-init:
    image: powerdns/pdns-auth-51@sha256:f976e753a1de8ec62636203ecb12ae5fa3d1055601be167de53f1f673e0abe59
    user: root
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >-
        if [ ! -f /var/lib/powerdns/pdns.sqlite3 ]; then
          sqlite3 /var/lib/powerdns/pdns.sqlite3 < /usr/local/share/doc/pdns/schema.sqlite3.sql;
        fi;
        chown -R 953:953 /var/lib/powerdns
    volumes:
      - secondary-data:/var/lib/powerdns

  primary:
    image: powerdns/pdns-auth-51@sha256:f976e753a1de8ec62636203ecb12ae5fa3d1055601be167de53f1f673e0abe59
    depends_on:
      primary-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-lc", "umask 0002 && exec /usr/local/sbin/pdns_server-startup $$@", "--"]
    command:
      - --local-address=0.0.0.0
      - --api-key=${PDNS_API_KEY:-local-pdns-api-key}
      - --also-notify=172.30.53.11
      - --webserver-address=0.0.0.0
      # The published API port is host-loopback only. Docker's NAT source
      # address varies by engine, so do not duplicate production's source
      # allowlist inside this disposable bridge harness.
      - --webserver-allow-from=0.0.0.0/0
    networks:
      hns-test:
        ipv4_address: 172.30.53.10
    volumes:
      - ../hns-authoritative-dns/config/pdns.conf:/etc/powerdns/pdns.conf:ro
      - primary-data:/var/lib/powerdns

  secondary:
    image: powerdns/pdns-auth-51@sha256:f976e753a1de8ec62636203ecb12ae5fa3d1055601be167de53f1f673e0abe59
    depends_on:
      secondary-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-lc", "umask 0002 && exec /usr/local/sbin/pdns_server-startup $$@", "--"]
    command:
      - --local-address=0.0.0.0
      - --allow-notify-from=172.30.53.10
    networks:
      hns-test:
        ipv4_address: 172.30.53.11
    volumes:
      - ../hns-secondary-dns/config/pdns.conf:/etc/powerdns/pdns.conf:ro
      - secondary-data:/var/lib/powerdns

  dns-tools:
    build:
      context: .
      dockerfile: Dockerfile.dns-tools
    profiles: [tools]
    networks:
      - hns-test
    volumes:
      - backup-test:/test:ro

  provisioner:
    image: oven/bun@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4
    profiles: [tools]
    working_dir: /workspace
    entrypoint: ["bun"]
    environment:
      PDNS_API_URL: http://primary:8081
      PDNS_API_KEY: ${PDNS_API_KEY:-local-pdns-api-key}
    networks:
      - hns-test
    volumes:
      - ../../..:/workspace:ro

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    profiles: [backup]
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: localminio
      MINIO_ROOT_PASSWORD: localminio-secret
    networks:
      - hns-test
    volumes:
      - minio-data:/data

  minio-setup:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    profiles: [backup]
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >-
        until mc alias set local http://minio:9000 localminio localminio-secret; do sleep 1; done;
        mc mb --ignore-existing --with-lock local/hns-backups;
        mc retention set --default COMPLIANCE 1d local/hns-backups
    networks:
      - hns-test

  minio-client:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    profiles: [backup]
    environment:
      MC_HOST_local: http://localminio:localminio-secret@minio:9000
    networks:
      - hns-test
    volumes:
      - backup-test:/test

  backup-tools:
    build:
      context: .
      dockerfile: Dockerfile.backup-tools
    profiles: [backup]
    working_dir: /workspace
    networks:
      - hns-test
    volumes:
      - ../../..:/workspace:ro
      - primary-data:/source/pdns:ro
      - backup-test:/test

  restore-primary:
    image: powerdns/pdns-auth-51@sha256:f976e753a1de8ec62636203ecb12ae5fa3d1055601be167de53f1f673e0abe59
    profiles: [backup]
    entrypoint: ["/bin/sh", "-lc", "exec /usr/local/sbin/pdns_server-startup $$@", "--"]
    command:
      - --local-address=0.0.0.0
      - --gsqlite3-database=/test/restore/powerdns/pdns.sqlite3
      - --api=no
      - --webserver=no
    networks:
      hns-test:
        ipv4_address: 172.30.53.12
    volumes:
      - ../hns-authoritative-dns/config/pdns.conf:/etc/powerdns/pdns.conf:ro
      - backup-test:/test

networks:
  hns-test:
    ipam:
      config:
        - subnet: 172.30.53.0/24

volumes:
  primary-data:
  secondary-data:
  minio-data:
  backup-test:

schema_version: 1
status: <pre-cutover-or-active>
generated_at: <utc>
generated_by: workspace_owner
tool_versions:
  rad: 1.10.0
  infisical_cli: <version>
  age: <version>

escrow:
  provider: infisical-cloud-us
  organization_id: <recovery-org-uuid>
  project_id: <project-uuid>
  project_slug: pirate-recovery
  environment: recovery
  plan_tier: <verified-tier>
  audit_logs: true
  audit_retention: <verified-window>
  point_in_time_recovery: <true-or-false>
  secret_versioning_verified_at: <utc>
  storage_model: single-provider-replicated-encrypted-blob
  duplicate_private_key_copy: false
  human_members: 1
  machine_identities: 0
  placeholder_value: PENDING_NOT_USABLE

radicle_recovery_delegate:
  did: did:key:<public-did>
  public_key_openssh: ssh-ed25519 <public-key>
  secret_path: /radicle/RADICLE_RECOVERY_PRIVATE_KEY
  encrypted_key_file_sha256: <hex>
  passphrase_storage: separate-password-manager
  added_to_repositories: []
  last_drill_at: <utc>
  drill_result: pass

backup_age_identities:
  ns1:
    current:
      recipient: age1<public-recipient>
      secret_path: /backup-age/NS1_BACKUP_AGE_IDENTITY_CURRENT_WRAPPED
      wrapped_blob_sha256: <hex>
      wrapping_passphrase_storage: separate-password-manager
      rotated_at: <utc>
      last_drill_at: <utc>
    previous:
      recipient: age1<public-recipient>
      secret_path: /backup-age/NS1_BACKUP_AGE_IDENTITY_PREVIOUS_WRAPPED
      mode: decrypt-only
      last_old_recipient_backup_at: <utc>
      old_identity_retire_after: <utc>
  radicle_proof_state:
    current:
      recipient: age1<public-recipient>
      secret_path: /backup-age/RADICLE_PROOF_BACKUP_AGE_IDENTITY_CURRENT_WRAPPED
      wrapped_blob_sha256: <hex>
      wrapping_passphrase_storage: separate-password-manager
      rotated_at: <utc>
      last_drill_at: <utc>
    previous:
      recipient: age1<public-recipient>
      secret_path: /backup-age/RADICLE_PROOF_BACKUP_AGE_IDENTITY_PREVIOUS_WRAPPED
      mode: decrypt-only
      last_old_recipient_backup_at: <utc>
      old_identity_retire_after: <utc>

proof_backup_attestation:
  public_key_openssh: ssh-ed25519 <public-key>
  public_key_fingerprint: SHA256:<fingerprint>
  signature_namespace: pirate-radicle-proof-backup

retention_days: 30
account_recovery:
  account_model: <existing-operator-account-or-dedicated-account>
  mfa_method: <totp-or-hardware>
  hardware_mfa: <true-or-false>
  recovery_method_documented: <true-or-false>
  tested_at: <utc>

never_includes:
  - private_keys
  - passphrases
  - tokens
  - account_identifiers
  - decrypted_content

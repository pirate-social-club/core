services:
  powerdns:
    # 5.1 pinned by digest; validated against the verifier API client integration test 2026-07-13
    image: powerdns/pdns-auth-51@sha256:f976e753a1de8ec62636203ecb12ae5fa3d1055601be167de53f1f673e0abe59
    container_name: pirate-hns-authdns
    restart: unless-stopped
    ports:
      - "${EDGE_PUBLIC_IP:?set EDGE_PUBLIC_IP}:53:53/udp"
      - "${EDGE_PUBLIC_IP:?set EDGE_PUBLIC_IP}:53:53/tcp"
      - "127.0.0.1:8081:8081/tcp"
    entrypoint: ["/bin/sh", "-lc", "umask 0002 && exec /usr/local/sbin/pdns_server-startup"]
    volumes:
      - ./config/pdns.conf:/etc/pdns/pdns.conf:ro
      - ./data:/var/lib/powerdns
